<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#08080a">
<meta name="color-scheme" content="dark">
<meta name="description" content="Tessera — a calm, infinite canvas for ideas, references and plans. Free, private, offline.">
<title>Tessera</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08080a;--surface:#141417;--surface-2:#1a1a1e;--surface-3:#242429;
  --line:rgba(255,255,255,.065);--line-2:rgba(255,255,255,.11);--line-3:rgba(255,255,255,.2);
  --text:#ececef;--text-2:#a3a3ad;--text-3:#6c6c76;
  --accent:#a99bff;--accent-strong:#8f7dff;--accent-soft:rgba(169,155,255,.14);--accent-glow:rgba(169,155,255,.45);
  --danger:#ff6d84;--ok:#62d6a9;
  --ease:cubic-bezier(.22,1,.36,1);
  --shadow:0 1px 0 rgba(255,255,255,.035) inset,0 1px 2px rgba(0,0,0,.4),0 10px 30px -12px rgba(0,0,0,.7);
  --font:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --serif:'Instrument Serif',ui-serif,Georgia,serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
::selection{background:rgba(169,155,255,.35)}
svg{display:block;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
body.is-dragging,body.is-dragging *{cursor:grabbing!important}

/* ---------- Canvas ---------- */
#canvas{position:fixed;inset:0;touch-action:none;overflow:hidden;background-color:var(--bg);background-image:radial-gradient(circle at center,rgba(255,255,255,.08) 1px,transparent 1.3px);background-size:24px 24px}
#canvas::after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(130% 95% at 50% 40%,transparent 55%,rgba(0,0,0,.5));z-index:3}
#canvas.grab{cursor:grab}#canvas.panning{cursor:grabbing}
#canvas.file-over::before{content:'';position:absolute;inset:12px;border:1.5px dashed var(--accent);border-radius:24px;background:var(--accent-soft);z-index:6;pointer-events:none}
#stage{position:absolute;inset:0;transform-origin:50% 50%}
#stage.in{animation:stageIn .45s var(--ease)}#stage.out{animation:stageOut .45s var(--ease)}
@keyframes stageIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes stageOut{from{opacity:0;transform:scale(1.06)}to{opacity:1;transform:none}}
#world{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0;user-select:none;-webkit-user-select:none}
#links{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none;z-index:0}
.link-line{fill:none;stroke:rgba(255,255,255,.3);stroke-width:1.6;stroke-linecap:round;transition:stroke .15s;pointer-events:none}
.link-line.sel,.link-line.temp{stroke:var(--accent)}
.link-line.temp{stroke-dasharray:5 6}
.link-hit{fill:none;stroke:transparent;stroke-width:16;pointer-events:stroke;cursor:pointer}
.link-hit:hover+.link-line{stroke:rgba(255,255,255,.6)}
.link-hit:hover+.link-line.sel{stroke:var(--accent)}

/* ---------- Cards ---------- */
.card{position:absolute;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);color:var(--text);transition:box-shadow .22s var(--ease),border-color .2s,background .2s}
.card[data-color]{background:color-mix(in srgb,var(--tint) 8%,var(--surface))}
.card[data-color]::before{content:'';position:absolute;left:-1px;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--tint);box-shadow:0 0 12px color-mix(in srgb,var(--tint) 55%,transparent)}
[data-color=violet]{--tint:#a99bff}[data-color=sky]{--tint:#6fb7ff}[data-color=mint]{--tint:#62d6a9}[data-color=rose]{--tint:#ff7b9c}[data-color=amber]{--tint:#ff9f5a}[data-color=slate]{--tint:#9aa4b2}
.card:hover{border-color:var(--line-2)}
.card.selected{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),var(--shadow)}
.card.editing{border-color:var(--accent-strong)}
.card.dragging{box-shadow:0 0 0 1px var(--line-2),0 30px 60px -14px rgba(0,0,0,.9);transition:none}
.card.selected.dragging{box-shadow:0 0 0 3px var(--accent-soft),0 30px 60px -14px rgba(0,0,0,.9)}
.card.link-target{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft),0 0 34px -4px var(--accent-glow)}
.card.pop{animation:pop .4s var(--ease)}
@keyframes pop{from{opacity:0;transform:scale(.93) translateY(6px)}to{opacity:1;transform:none}}

.ch{position:absolute;right:-9px;top:50%;width:16px;height:16px;margin-top:-8px;border-radius:50%;background:var(--bg);border:1.5px solid var(--accent);opacity:0;transition:opacity .15s,transform .2s var(--ease);cursor:crosshair;z-index:2}
.ch::after{content:'';position:absolute;inset:3.5px;border-radius:50%;background:var(--accent)}
.ch:hover{transform:scale(1.3)}
.card:hover>.ch,.card.selected>.ch{opacity:1}
.card.dragging>.ch,.card.editing>.ch{opacity:0}
.rz{position:absolute;right:-6px;bottom:-6px;width:13px;height:13px;border-radius:4px;background:var(--surface-3);border:1.5px solid var(--accent);opacity:0;cursor:ew-resize;transition:opacity .15s;z-index:2}
.card.selected>.rz{opacity:1}

/* note */
.note-body{padding:14px 16px 15px;font-size:14px;line-height:1.6;min-height:50px;outline:none;overflow-wrap:anywhere}
.note-body[contenteditable=true]{cursor:text;user-select:text;-webkit-user-select:text}
.note-body:empty::before{content:'Write something…';color:var(--text-3)}
.note-body h1,.note-body h2,.note-body h3{font-family:var(--serif);font-weight:400;font-size:25px;line-height:1.15;margin:2px 0 8px;letter-spacing:-.005em}
.note-body ul,.note-body ol{margin:4px 0;padding-left:20px}
.note-body p{margin:0}.note-body a{color:var(--accent)}

/* todo */
.card.todo{padding:12px 12px 8px}
.todo-head{display:flex;align-items:center;gap:8px;padding:2px 4px 9px}
.todo-title{flex:1;min-width:0;background:none;border:0;outline:none;font-weight:600;font-size:14px;padding:0}
.todo-title::placeholder,.ti-text::placeholder{color:var(--text-3)}
.todo-count{font-size:11px;color:var(--text-3);font-variant-numeric:tabular-nums}
.todo-bar{height:3px;border-radius:3px;background:rgba(255,255,255,.06);margin:0 4px 8px;overflow:hidden}
.todo-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent-strong),var(--accent));border-radius:3px;transition:width .4s var(--ease)}
.ti-row{display:flex;align-items:flex-start;gap:10px;padding:5px 4px;border-radius:8px;transition:background .15s}
.ti-row:hover{background:rgba(255,255,255,.025)}
.chk{flex:none;width:18px;height:18px;margin-top:1px;border-radius:6px;border:1.5px solid var(--line-3);display:grid;place-items:center;color:transparent;transition:all .2s var(--ease)}
.chk:hover{border-color:var(--accent)}
.ti-row.done .chk{background:var(--accent);border-color:var(--accent);color:#0b0b0e}
.ti-text{flex:1;min-width:0;background:none;border:0;outline:none;resize:none;padding:0;line-height:1.45;font-size:13.5px;overflow:hidden;display:block;transition:color .2s}
.ti-row.done .ti-text{color:var(--text-3);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.25)}
.todo-add{display:flex;align-items:center;gap:9px;width:100%;padding:7px 6px;margin-top:2px;border-radius:8px;color:var(--text-3);font-size:12.5px}
.todo-add:hover{color:var(--text-2);background:rgba(255,255,255,.03)}

/* link */
.card.link{padding:12px}
.lk{display:flex;align-items:center;gap:12px}
.fav{position:relative;width:42px;height:42px;flex:none;border-radius:11px;background:linear-gradient(145deg,var(--surface-3),var(--surface-2));border:1px solid var(--line-2);display:grid;place-items:center;overflow:hidden;font-weight:600;color:var(--text-2)}
.fav img{position:absolute;inset:0;margin:auto;width:22px;height:22px;border-radius:5px;background:var(--surface-3)}
.lk-meta{flex:1;min-width:0}
.lk-title{font-weight:600;font-size:13.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;outline:none;overflow-wrap:anywhere}
.lk-title[contenteditable=true]{display:block;user-select:text;-webkit-user-select:text}
.lk-host{font-size:11.5px;color:var(--text-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lk-open{width:30px;height:30px;flex:none;border-radius:9px;display:grid;place-items:center;color:var(--text-2);background:rgba(255,255,255,.04);border:1px solid var(--line);transition:all .15s}
.lk-open:hover{color:var(--accent);border-color:rgba(169,155,255,.35)}

/* image */
.card.image{padding:0}
.img-wrap{border-radius:13px;overflow:hidden;background:linear-gradient(110deg,var(--surface-2) 30%,var(--surface-3) 50%,var(--surface-2) 70%);background-size:300% 100%;animation:shimmer 1.6s linear infinite}
.img-wrap img{display:block;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s}
.img-wrap img.ok{opacity:1}
.img-wrap:has(img.ok){animation:none;background:var(--surface-2)}
@keyframes shimmer{to{background-position:-150% 0}}

/* board */
.card.board{width:132px;padding:8px 6px 6px;background:transparent!important;border-color:transparent;box-shadow:none;display:flex;flex-direction:column;align-items:center;text-align:center}
.card.board::before{display:none}
.card.board:hover{border-color:transparent}
.card.board.selected{border-color:transparent;box-shadow:none}
.tile{width:88px;height:88px;border-radius:24px;display:grid;place-items:center;color:var(--tint,var(--accent));background:radial-gradient(120% 120% at 20% 0%,color-mix(in srgb,var(--tint,var(--accent)) 28%,#1c1c22) 0%,#121216 72%);border:1px solid var(--line-2);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 16px 30px -12px rgba(0,0,0,.85);transition:transform .3s var(--ease),box-shadow .25s;overflow:hidden}
.card.board:hover .tile{transform:translateY(-2px)}
.card.board.selected .tile{box-shadow:0 0 0 2.5px var(--accent),0 0 0 7px var(--accent-soft),0 16px 30px -12px rgba(0,0,0,.85)}
.tile.mosaic{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:3px;padding:5px;place-items:stretch}
.tile.mosaic img{width:100%;height:100%;min-height:0;object-fit:cover;border-radius:7px;background:var(--surface-3)}
.tile.mosaic[data-n="1"] img{grid-column:1/3;grid-row:1/3;border-radius:19px}
.tile.mosaic[data-n="2"] img{grid-row:1/3}
.tile.mosaic[data-n="3"] img:first-child{grid-row:1/3}
.b-meta{min-width:0;max-width:100%}
.bt{margin-top:10px;font-size:13px;font-weight:550;line-height:1.3;max-width:124px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;outline:none}
.bt[contenteditable=true]{white-space:normal;overflow:visible;user-select:text;-webkit-user-select:text}
.bc{font-size:11px;color:var(--text-3);margin-top:2px}
.card.board>.ch{top:52px}

/* column */
.card.column{padding:10px;background:#0f0f12}
.card.column[data-color]{background:color-mix(in srgb,var(--tint) 6%,#0f0f12)}
.col-head{display:flex;align-items:center;gap:8px;padding:4px 6px 10px}
.col-title{flex:1;min-width:0;font-weight:600;font-size:13px;outline:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.col-title[contenteditable=true]{white-space:normal;user-select:text;-webkit-user-select:text}
.col-count{font-size:11px;color:var(--text-3);background:rgba(255,255,255,.05);border-radius:20px;padding:2px 8px;font-variant-numeric:tabular-nums}
.col-body{position:relative;display:flex;flex-direction:column;gap:8px;min-height:60px}
.col-body>.card{position:relative;left:auto;top:auto;width:auto}
.col-body>.card.board{flex-direction:row;align-items:center;gap:12px;padding:8px;text-align:left;background:var(--surface)!important;border-color:var(--line);box-shadow:var(--shadow)}
.col-body>.card.board.selected{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),var(--shadow)}
.col-body .tile{width:44px;height:44px;border-radius:13px}
.col-body .card.board.selected .tile{box-shadow:none}
.col-body .tile>svg{width:20px;height:20px}
.col-body .bt{margin-top:0;max-width:none}
.col-body>.card.board>.ch{top:50%}
.col-empty{border:1.5px dashed var(--line-2);border-radius:11px;display:grid;place-items:center;height:64px;color:var(--text-3);font-size:12px}
.card.column.drop-target{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),var(--shadow)}
.col-ind{position:absolute;left:4px;right:4px;height:3px;border-radius:3px;background:var(--accent);box-shadow:0 0 14px var(--accent-glow);pointer-events:none;z-index:5}

/* ---------- Chrome ---------- */
.glass{background:rgba(18,18,22,.74);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);border:1px solid var(--line-2);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 18px 40px -16px rgba(0,0,0,.85)}
.bar{position:fixed;top:calc(12px + env(safe-area-inset-top));height:48px;display:flex;align-items:center;gap:2px;padding:0 6px;border-radius:15px;z-index:60;touch-action:manipulation}
#tl{left:12px;padding-left:12px;max-width:calc(100vw - 420px)}
#tr{right:12px}
.brand{display:flex;align-items:center;gap:9px;padding-right:4px;flex:none}
.brand-name{font-family:var(--serif);font-size:21px;line-height:1;letter-spacing:.005em}
.vsep{width:1px;height:20px;background:var(--line-2);margin:0 6px;flex:none}
#crumbs{display:flex;align-items:center;min-width:0;overflow:hidden}
.crumb{display:flex;align-items:center;gap:6px;height:32px;padding:0 9px;border-radius:9px;color:var(--text-2);font-size:13px;font-weight:500;white-space:nowrap;min-width:0;max-width:220px;cursor:pointer;transition:background .15s,color .15s}
.crumb span{overflow:hidden;text-overflow:ellipsis;outline:none}
.crumb span[contenteditable=true]{cursor:text}
.crumb:hover{background:rgba(255,255,255,.05);color:var(--text)}
.crumb.cur{color:var(--text)}
.crumb-sep,.crumb-ell{color:var(--text-3);flex:none;padding:0 1px}
.ib{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--text-2);transition:background .15s,color .15s,opacity .15s;flex:none}
.ib:hover{background:rgba(255,255,255,.06);color:var(--text)}
.ib:disabled{opacity:.28;pointer-events:none}
.zl{min-width:50px;height:30px;border-radius:9px;font-size:12px;font-weight:500;color:var(--text-2);font-variant-numeric:tabular-nums;transition:background .15s,color .15s}
.zl:hover{background:rgba(255,255,255,.06);color:var(--text)}
.chip{display:flex;align-items:center;gap:8px;height:30px;padding:0 11px 0 10px;border-radius:9px;font-size:12px;color:var(--text-2);font-weight:500;white-space:nowrap;transition:background .15s,color .15s}
.chip:hover{background:rgba(255,255,255,.05);color:var(--text)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(98,214,169,.15);flex:none}
.dot.warn{background:var(--danger);box-shadow:0 0 0 3px rgba(255,109,132,.15)}

#dock{position:fixed;left:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:2px;padding:7px;border-radius:20px;z-index:50;touch-action:none}
.tool{width:60px;padding:9px 0 7px;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10.5px;font-weight:500;color:var(--text-2);user-select:none;-webkit-user-select:none;transition:color .15s,background .15s}
.tool .tic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);color:var(--text);transition:transform .25s var(--ease),background .2s,color .2s,border-color .2s}
.tool:hover{color:var(--text);background:rgba(255,255,255,.03)}
.tool:hover .tic{transform:translateY(-1px);color:var(--accent);border-color:rgba(169,155,255,.35);background:var(--surface-3)}
.tool:active .tic{transform:scale(.94)}
.ghost{position:fixed;left:0;top:0;z-index:400;display:flex;gap:9px;align-items:center;padding:10px 15px;border-radius:13px;font-size:13px;font-weight:500;pointer-events:none;margin:-22px 0 0 -20px;color:var(--text)}
.ghost svg{color:var(--accent)}

/* menus */
.menu{position:fixed;z-index:200;min-width:224px;padding:6px;border-radius:15px;opacity:0;transform:scale(.97) translateY(-4px);transition:opacity .16s var(--ease),transform .2s var(--ease);pointer-events:none;background:rgba(22,22,27,.9)}
.menu.show{opacity:1;transform:none;pointer-events:auto}
.mi{display:flex;align-items:center;gap:10px;width:100%;height:34px;padding:0 10px;border-radius:9px;font-size:13px;color:var(--text);text-align:left;transition:background .12s}
.mi svg{color:var(--text-2)}
.mi:hover{background:rgba(255,255,255,.065)}
.mi:hover svg{color:var(--text)}
.mi.danger,.mi.danger svg{color:var(--danger)}
.mi .k{margin-left:auto;color:var(--text-3);font-size:11.5px}
.msep{height:1px;background:var(--line-2);margin:5px 4px}
.mlabel{padding:7px 10px 2px;font-size:10.5px;color:var(--text-3);font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.swatches{display:flex;gap:8px;padding:8px 10px 7px}
.sw{width:20px;height:20px;border-radius:50%;background:var(--tint);border:1.5px solid rgba(255,255,255,.14);position:relative;transition:transform .18s var(--ease)}
.sw:hover{transform:scale(1.15)}
.sw.none{background:var(--surface-3);overflow:hidden}
.sw.none::after{content:'';position:absolute;left:50%;top:-2px;bottom:-2px;width:1.5px;background:var(--text-3);transform:rotate(45deg)}
.sw.on{box-shadow:0 0 0 2px #16161b,0 0 0 3.5px var(--text)}

#fmt{position:fixed;z-index:120;display:flex;align-items:center;gap:2px;padding:4px;border-radius:12px;opacity:0;pointer-events:none;transform:translateY(4px);transition:opacity .15s,transform .2s var(--ease)}
#fmt.show{opacity:1;pointer-events:auto;transform:none}
#fmt button{width:30px;height:30px;border-radius:8px;font-size:13.5px;color:var(--text-2);display:grid;place-items:center;transition:background .12s,color .12s}
#fmt button:hover{background:rgba(255,255,255,.07);color:var(--text)}
#fmt button.on{color:var(--accent);background:var(--accent-soft)}
#fmt .fsep{width:1px;height:18px;background:var(--line-2);margin:0 3px}

#marquee{position:fixed;display:none;border:1px solid var(--accent);background:rgba(169,155,255,.08);border-radius:5px;z-index:30;pointer-events:none}

#empty{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;z-index:4;opacity:0;transition:opacity .45s;width:min(360px,80vw)}
#empty.show{opacity:1}
.em-ic{width:68px;height:68px;margin:0 auto 20px;border-radius:22px;display:grid;place-items:center;color:var(--accent);background:radial-gradient(120% 120% at 20% 0%,rgba(169,155,255,.25),#121216 72%);border:1px solid var(--line-2);box-shadow:0 20px 40px -18px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.08)}
#empty h3{font-family:var(--serif);font-weight:400;font-size:30px;margin:0 0 8px;letter-spacing:-.005em}
#empty p{color:var(--text-3);font-size:13px;margin:0;line-height:1.65}

/* modal */
.overlay{position:fixed;inset:0;z-index:300;display:grid;place-items:center;padding:20px;background:rgba(4,4,6,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);opacity:0;transition:opacity .22s}
.overlay.show{opacity:1}
.modal{width:min(470px,100%);border-radius:24px;padding:28px 28px 22px;transform:translateY(12px) scale(.98);transition:transform .38s var(--ease);background:rgba(20,20,25,.94);max-height:calc(100vh - 40px);overflow:auto}
.overlay.show .modal{transform:none}
.modal h2{font-family:var(--serif);font-weight:400;font-size:31px;line-height:1.08;margin:0 0 12px;letter-spacing:-.01em}
.eyebrow{font-size:10.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--accent);font-weight:600;margin-bottom:12px}
.m-body{color:var(--text-2);font-size:13.5px;line-height:1.6}
.m-body p{margin:0 0 12px}.m-body b{color:var(--text);font-weight:600}
.m-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}
.btn{height:40px;padding:0 18px;border-radius:12px;font-size:13px;font-weight:600;color:var(--text);background:rgba(255,255,255,.06);border:1px solid var(--line-2);transition:all .15s}
.btn:hover{background:rgba(255,255,255,.1)}
.btn.primary{background:linear-gradient(180deg,#bdb2ff,#9584ff);color:#0d0a1c;border-color:transparent;box-shadow:0 10px 26px -10px var(--accent-glow),inset 0 1px 0 rgba(255,255,255,.4)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{background:rgba(255,109,132,.12);color:var(--danger);border-color:rgba(255,109,132,.28)}
.facts{list-style:none;margin:16px 0 6px;padding:0;display:grid;gap:9px}
.facts li{display:flex;gap:13px;align-items:flex-start;padding:13px 15px;border-radius:14px;background:rgba(255,255,255,.028);border:1px solid var(--line)}
.facts li svg{color:var(--accent);margin-top:2px}
.facts b{display:block;margin-bottom:2px}
.stat{display:flex;justify-content:space-between;gap:12px;padding:11px 2px;border-top:1px solid var(--line);font-size:13px}
.stat b{font-weight:550}
.warnbox{padding:12px 14px;border-radius:13px;background:rgba(255,109,132,.08);border:1px solid rgba(255,109,132,.25);color:#ffb3c0;margin-bottom:12px}
.field{display:block;margin-top:14px}
.field input{width:100%;height:46px;border-radius:13px;background:rgba(0,0,0,.35);border:1px solid var(--line-2);padding:0 15px;outline:none;font-size:14px;transition:border-color .15s,box-shadow .15s}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.shake{animation:shake .38s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.kbd-grid{display:grid;grid-template-columns:1fr auto;gap:9px 18px;font-size:13px;align-items:center}
.kbd-grid span:nth-child(odd){color:var(--text-2)}
kbd{font-family:var(--font);font-size:11.5px;padding:3px 7px;border-radius:6px;background:rgba(255,255,255,.06);border:1px solid var(--line-2);color:var(--text);white-space:nowrap}
.lb img{max-width:92vw;max-height:86vh;border-radius:16px;box-shadow:0 40px 90px -20px #000;transform:scale(.96);transition:transform .35s var(--ease)}
.overlay.show.lb img{transform:none}
.lb-x{position:fixed;top:16px;right:16px;background:rgba(255,255,255,.08)}

/* toast */
#toasts{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;z-index:250;pointer-events:none}
.toast{display:flex;align-items:center;gap:12px;padding:11px 16px;border-radius:13px;font-size:13px;opacity:0;transform:translateY(10px) scale(.98);transition:all .3s var(--ease);pointer-events:auto;white-space:nowrap}
.toast.has-act{padding-right:8px}
.toast.show{opacity:1;transform:none}
.toast button{color:var(--accent);font-weight:600;padding:6px 10px;border-radius:8px}
.toast button:hover{background:var(--accent-soft)}

@media (max-width:760px){
  #dock{left:50%;top:auto;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);flex-direction:row;padding:6px;border-radius:19px}
  .tool{width:50px;padding:7px 0 5px;font-size:9.5px;gap:4px}
  .tool .tic{width:30px;height:30px}
  .brand-name,.chip span,.hide-sm{display:none!important}
  #tl{max-width:calc(100vw - 196px)}
  #toasts{bottom:calc(96px + env(safe-area-inset-bottom))}
  .chip{padding:0 10px}
}
@media (hover:none){
  .card:hover>.ch{opacity:0}.card.selected>.ch{opacity:1}
  .ch{width:22px;height:22px;margin-top:-11px;right:-12px}.ch::after{inset:5px}
  .rz{width:18px;height:18px;right:-8px;bottom:-8px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

<body>
<div id="canvas"><div id="stage"><div id="world"></div></div></div>

<div id="tl" class="bar glass">
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="bm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d6ceff"/><stop offset="1" stop-color="#8f7dff"/></linearGradient></defs><rect x="2" y="2" width="9" height="12" rx="2.6" fill="url(#bm)"/><rect x="13" y="2" width="9" height="7" rx="2.6" fill="url(#bm)" opacity=".55"/><rect x="2" y="16" width="9" height="6" rx="2.6" fill="url(#bm)" opacity=".35"/><rect x="13" y="11" width="9" height="11" rx="2.6" fill="url(#bm)" opacity=".8"/></svg>
    <span class="brand-name">Tessera</span>
  </div>
  <div class="vsep"></div>
  <nav id="crumbs" aria-label="Boards"></nav>
</div>

<div id="tr" class="bar glass">
  <button class="chip" id="chip" title="Where your boards are stored"><i class="dot" id="dot"></i><span id="chipText">On this device</span></button>
  <div class="vsep"></div>
  <button class="ib" id="undoBtn" title="Undo (Ctrl Z)" data-ico="undo"></button>
  <button class="ib" id="redoBtn" title="Redo (Ctrl Shift Z)" data-ico="redo"></button>
  <div class="vsep hide-sm"></div>
  <button class="ib hide-sm" id="zoomOut" title="Zoom out (Ctrl −)" data-ico="minus"></button>
  <button class="zl" id="zl" title="Reset to 100%">100%</button>
  <button class="ib hide-sm" id="zoomIn" title="Zoom in (Ctrl +)" data-ico="plus"></button>
  <button class="ib hide-sm" id="fitBtn" title="Fit to screen (Ctrl 0)" data-ico="fit"></button>
  <div class="vsep"></div>
  <button class="ib" id="moreBtn" title="Menu" data-ico="more"></button>
</div>

<nav id="dock" class="glass" aria-label="Add cards"></nav>

<div id="empty"><div class="em-ic" data-ico="board" data-s="28"></div><h3>A blank board</h3><p>Drag a card from the dock, double-click anywhere to write, or drop images straight onto the canvas.</p></div>

  <span class="fsep"></span>
  <button data-cmd="heading" title="Heading" style="font-family:var(--serif);font-size:18px">H</button>
  <button data-cmd="insertUnorderedList" title="Bulleted list" data-ico="list" data-s="16"></button>
</div>
<div id="toasts"></div>

<script>
(() => {
'use strict';

/* ================= Utilities ================= */
const $ = (s, r = document) => r.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const NS = 'http://www.w3.org/2000/svg';

const ICONS = {
  note:'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="M8 13h8M8 17h5"/>',
  todo:'<rect x="3" y="3" width="18" height="18" rx="4.5"/><path d="m8 12 3 3 5-6"/>',
  link:'<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>',
  image:'<rect x="3" y="3" width="18" height="18" rx="4.5"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/>',
  board:'<rect x="3" y="3" width="7.5" height="10" rx="2.2"/><rect x="13.5" y="3" width="7.5" height="6" rx="2.2"/><rect x="3" y="16" width="7.5" height="5" rx="2.2"/><rect x="13.5" y="12" width="7.5" height="9" rx="2.2"/>',
  column:'<rect x="3" y="3" width="7.5" height="18" rx="2.2"/><rect x="13.5" y="3" width="7.5" height="11" rx="2.2"/>',
  undo:'<path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>',
  redo:'<path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/>',
  plus:'<path d="M12 5v14M5 12h14"/>', minus:'<path d="M5 12h14"/>',
  fit:'<path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/>',
  more:'<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>',
  chev:'<path d="m9 18 6-6-6-6"/>',
  home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  download:'<path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>', upload:'<path d="M12 16V4M7 9l5-5 5 5M5 21h14"/>',
  device:'<rect x="5" y="2" width="14" height="20" rx="3"/><path d="M11 18h2"/>',
  trash:'<path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>',
  copy:'<rect x="9" y="9" width="12" height="12" rx="3"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/>',
  external:'<path d="M7 17 17 7M8 7h9v9"/>',
  front:'<rect x="8" y="8" width="13" height="13" rx="3"/><path d="M16 4H5a1 1 0 0 0-1 1v11"/>',
  back:'<rect x="3" y="3" width="13" height="13" rx="3"/><path d="M20 8v11a1 1 0 0 1-1 1H8"/>',
  keyboard:'<rect x="2" y="6" width="20" height="12" rx="3"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/>',
  install:'<path d="M12 3v11M8 10l4 4 4-4"/><rect x="3" y="16" width="18" height="5" rx="2"/>',
  open:'<path d="M5 12h14M13 6l6 6-6 6"/>', x:'<path d="M18 6 6 18M6 6l12 12"/>',
  check:'<path d="m5 12.5 4.5 4.5L19 7"/>', pen:'<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/>',
  list:'<path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/>',
  select:'<path d="M5 3h2M11 3h2M17 3h2M21 5v2M21 11v2M21 17v2M3 5v2M3 11v2M3 17v2M5 21h2M11 21h2M17 21h2"/>',
  swap:'<path d="M7 7h12l-4-4M17 17H5l4 4"/>', shield:'<path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/>'
};
const ico = (n, s = 18) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n] || ''}</svg>`;
const COLORS = ['violet','sky','mint','rose','amber','slate'];
const TOOLS = [['note','Note','N'],['todo','To-do','T'],['link','Link','L'],['image','Image','I'],['board','Board','B'],['column','Column','C']];
const W = {note:280, todo:260, link:300, image:300, board:132, column:280};
const MIN_W = {note:160, todo:200, link:220, image:110, column:200};

function hostOf(u){ try { return new URL(u).hostname.replace(/^www\./,''); } catch { return u; } }
function normUrl(u){ u = (u||'').trim(); if (u && !/^[a-z][\w+.-]*:\/\//i.test(u)) u = 'https://' + u; return u; }
function isUrl(u){ try { const x = new URL(u); return /^https?:$/.test(x.protocol) && (x.hostname.includes('.') || x.hostname === 'localhost'); } catch { return false; } }
function fmtBytes(b){ if (!b) return '0 KB'; const u=['B','KB','MB','GB']; let i=0; while (b>=1024 && i<3){ b/=1024; i++; } return b.toFixed(i>1?1:0)+' '+u[i]; }
function relTime(t){ const s=(Date.now()-t)/1000; if (s<60) return 'Just now'; if (s<3600) return Math.floor(s/60)+' min ago'; if (s<86400) return Math.floor(s/3600)+' h ago'; const d=Math.floor(s/86400); return d===1?'Yesterday':d+' days ago'; }

/* ================= Storage (IndexedDB) ================= */
let db = null, storageOK = true;
const memImages = new Map(), imgCache = new Map();
function openDB(){
  return new Promise(res => {
    try {
      const rq = indexedDB.open('tessera', 1);
      rq.onupgradeneeded = () => { const d = rq.result; d.createObjectStore('kv'); d.createObjectStore('img'); };
      rq.onsuccess = () => res(rq.result); rq.onerror = () => res(null); rq.onblocked = () => res(null);
    } catch { res(null); }
  });
}
function idb(store, mode, fn){
  return new Promise((res, rej) => {
    const tx = db.transaction(store, mode); const r = fn(tx.objectStore(store));
    tx.oncomplete = () => res(r ? r.result : undefined); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
  });
}
const kvGet = k => idb('kv','readonly', s => s.get(k));
const kvSet = (k, v) => idb('kv','readwrite', s => s.put(v, k));
async function imgPut(id, url){ if (!db) { memImages.set(id, url); return; } await idb('img','readwrite', s => s.put(url, id)); }
async function loadImg(id){
  if (!id) return null; if (imgCache.has(id)) return imgCache.get(id);
  let u = null; try { u = db ? await idb('img','readonly', s => s.get(id)) : memImages.get(id); } catch {}
  if (u) imgCache.set(id, u); return u;
}
async function idbClear(store){ if (db) await idb(store,'readwrite', s => s.clear()); }
function usedImageIds(){ const ids = new Set(); for (const b of Object.values(S.boards)) for (const c of Object.values(b.cards)) if (c.type==='image' && c.imageId) ids.add(c.imageId); return ids; }
async function gcImages(){ if (!db) return; try { const used = usedImageIds(); const keys = await idb('img','readonly', s => s.getAllKeys()); for (const k of keys) if (!used.has(k)) await idb('img','readwrite', s => s.delete(k)); } catch {} }

let saveT = 0;
function saveSoon(){ clearTimeout(saveT); saveT = setTimeout(saveNow, 300); }
async function saveNow(){
  clearTimeout(saveT); if (!db) return;
  try { S.meta.lastBoard = curId; await kvSet('state', S); }
  catch { toast('Couldn’t save — storage may be full. Export a backup.', {label:'Export', fn:exportBackup}, 7000); }
}

/* ================= State ================= */
let S = null, curId = null;
const sel = new Set(); let selLink = null;
const fresh = new Set();
const cur = () => S.boards[curId];
const findCard = id => cur().cards[id];
function newBoard(title, parent){ const b = {id:uid(), title, parent, cards:{}, links:[], view:{x:0,y:0,s:1,set:false}}; S.boards[b.id] = b; return b; }
function maxZ(b = cur()){ let m = 0; for (const c of Object.values(b.cards)) m = Math.max(m, c.z||0); return m; }
function normalizeZ(b = cur()){ Object.values(b.cards).sort((a,c)=>(a.z||0)-(c.z||0)).forEach((c,i)=>c.z=i+1); }

function seed(){
  S = {app:'tessera', version:1, rootId:null, boards:{}, meta:{welcomed:false, lastExport:0}};
  const root = newBoard('Home', null); S.rootId = root.id;
  const mood = newBoard('Moodboard', root.id);
  const put = c => (root.cards[c.id] = c);
  const n1 = put({id:uid(), type:'note', x:-450, y:-200, w:300, z:1, color:'violet',
    html:'<h3>Welcome to Tessera</h3><div>A calm, infinite canvas for ideas, references and plans. Double-click anywhere to write, drag cards in from the dock, or drop images straight onto the board.</div>'});
  const t1 = put({id:uid(), type:'todo', x:-90, y:-200, w:270, z:2, color:null, title:'Get started', items:[
    {id:uid(), text:'Double-click the canvas to write a note', done:false},
    {id:uid(), text:'Drag a card into the Ideas column', done:false},
    {id:uid(), text:'Open the Moodboard and drop in images', done:false},
    {id:uid(), text:'Export a backup from the ⋯ menu', done:false}]});
  const col = put({id:uid(), type:'column', x:240, y:-200, w:270, z:3, color:null, title:'Ideas', children:[]});
  const k1 = put({id:uid(), type:'note', x:0, y:0, w:270, z:4, color:'mint', parent:col.id, html:'<div>Cards can live inside columns. Drag them in and out to group things.</div>'});
  const k2 = put({id:uid(), type:'note', x:0, y:0, w:270, z:5, color:'rose', parent:col.id, html:'<div>Right-click (or long-press) any card for colours, duplicate and more.</div>'});
  col.children.push(k1.id, k2.id);
  put({id:uid(), type:'board', x:-420, y:110, w:132, z:6, color:null, target:mood.id});
  root.links.push({id:uid(), from:n1.id, to:t1.id});
}

/* ---------- history ---------- */
const hist = {past:[], future:[]};
let editSnap = null;
const snapshot = () => JSON.stringify(S.boards, (k, v) => k === 'view' ? undefined : v);
function pushPast(s){ hist.past.push(s); if (hist.past.length > 100) hist.past.shift(); hist.future.length = 0; updateUndoUI(); }
const commit = () => pushPast(snapshot());
function flushEdit(){ if (editSnap){ if (snapshot() !== editSnap) pushPast(editSnap); editSnap = null; } }
function restore(str){
  const r = JSON.parse(str);
  for (const id in r) r[id].view = S.boards[id]?.view || {x:0,y:0,s:1,set:false};
  S.boards = r; if (!S.boards[curId]) curId = S.rootId;
  sel.clear(); selLink = null; render(); saveSoon();
}
function undo(){ if (!hist.past.length) return; hist.future.push(snapshot()); restore(hist.past.pop()); updateUndoUI(); }
function redo(){ if (!hist.future.length) return; hist.past.push(snapshot()); restore(hist.future.pop()); updateUndoUI(); }
function updateUndoUI(){ $('#undoBtn').disabled = !hist.past.length; $('#redoBtn').disabled = !hist.future.length; }

/* ================= DOM refs ================= */
const canvas = $('#canvas'), stage = $('#stage'), world = $('#world'), ctx = $('#ctx'), fmt = $('#fmt');
let linksG = null;

/* ================= View ================= */
function applyView(){
  const v = cur().view; v.set = true;
  world.style.transform = `translate(${v.x}px,${v.y}px) scale(${v.s})`;
  let g = 24 * v.s; while (g < 12) g *= 2;
  canvas.style.backgroundSize = `${g}px ${g}px`;
  canvas.style.backgroundPosition = `${v.x}px ${v.y}px`;
  $('#zl').textContent = Math.round(v.s * 100) + '%';
  if (fmtFor) positionFormatBar();
}
function screenToWorld(x, y){ const v = cur().view; return {x:(x - v.x) / v.s, y:(y - v.y) / v.s}; }
function zoomAt(px, py, ns){
  const v = cur().view; ns = clamp(ns, .15, 3);
  const wx = (px - v.x) / v.s, wy = (py - v.y) / v.s;
  v.s = ns; v.x = px - wx * ns; v.y = py - wy * ns; applyView(); saveSoon();
}
let animRAF = 0;
function animateView(t, anim = true){
  const v = cur().view; cancelAnimationFrame(animRAF);
  if (!anim){ Object.assign(v, t); applyView(); saveSoon(); return; }
  const f = {x:v.x, y:v.y, s:v.s}, t0 = performance.now(), D = 380;
  const step = now => {
    const k = Math.min(1, (now - t0) / D), e = 1 - Math.pow(1 - k, 4);
    v.x = f.x + (t.x - f.x) * e; v.y = f.y + (t.y - f.y) * e; v.s = f.s + (t.s - f.s) * e;
    applyView(); if (k < 1) animRAF = requestAnimationFrame(step); else saveSoon();
  };
  animRAF = requestAnimationFrame(step);
}
function zoomTo(ns){
  const v = cur().view, cx = innerWidth / 2, cy = innerHeight / 2; ns = clamp(ns, .15, 3);
  const wx = (cx - v.x) / v.s, wy = (cy - v.y) / v.s;
  animateView({s:ns, x:cx - wx * ns, y:cy - wy * ns});
}
const zoomBy = f => zoomTo(cur().view.s * f);
function fit(anim = true){
  const els = [...world.querySelectorAll(':scope > .card')];
  const narrow = innerWidth <= 760;
  const padL = narrow ? 24 : 110, padR = narrow ? 24 : 48, padT = 92, padB = narrow ? 112 : 56;
  const aw = innerWidth - padL - padR, ah = innerHeight - padT - padB;
  if (!els.length){ animateView({s:1, x:innerWidth/2, y:innerHeight/2}, anim); return; }
  let x1=Infinity, y1=Infinity, x2=-Infinity, y2=-Infinity;
  for (const el of els){ const r = getWorldRect(el.dataset.id); x1=Math.min(x1,r.x); y1=Math.min(y1,r.y); x2=Math.max(x2,r.x+r.w); y2=Math.max(y2,r.y+r.h); }
  const bw = Math.max(1, x2 - x1), bh = Math.max(1, y2 - y1);
  const s = clamp(Math.min(aw / bw, ah / bh, 1.1), .15, 1.1);
  animateView({s, x: padL + (aw - bw * s) / 2 - x1 * s, y: padT + (ah - bh * s) / 2 - y1 * s}, anim);
}
let cascade = {t:0, n:0};
function centerWorld(){

const elOf = id => world.querySelector(`.card[data-id="${CSS.escape(id)}"]`);
function getWorldRect(id){

  const r = el.getBoundingClientRect(), v = cur().view;

}
function makeSvg(){
  const s = document.createElementNS(NS, 'svg'); s.id = 'links';
  const mk = (id, col) => `<marker id="${id}" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1.5 8.5 5 1.5 8.5" fill="none" stroke="${col}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>`;
  s.innerHTML = `<defs>${mk('arr','rgba(255,255,255,.5)')}${mk('arr-sel','#a99bff')}</defs><g></g>`;
  linksG = s.querySelector('g'); return s;
}
function edgePoint(r, p, pad = 5){

  if (!dx && !dy) return {x:cx, y:cy};

}
function drawLinks(){
  if (!linksG) return; const b = cur(); let h = '';

    const A = getWorldRect(l.from), B = getWorldRect(l.to); if (!A || !B) continue;
    const ca = {x:A.x + A.w/2, y:A.y + A.h/2}, cb = {x:B.x + B.w/2, y:B.y + B.h/2};
    const p1 = edgePoint(A, cb, 4), p2 = edgePoint(B, ca, 7), on = selLink === l.id;
    const d = `M${p1.x.toFixed(1)} ${p1.y.toFixed(1)}L${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`;
    h += `<path class="link-hit" data-id="${l.id}" d="${d}"/><path class="link-line${on?' sel':''}" d="${d}" marker-end="url(#${on?'arr-sel':'arr'})"/>`;

}

const ALLOWED = new Set(['B','STRONG','I','EM','U','S','STRIKE','BR','DIV','P','UL','OL','LI','H1','H2','H3','SPAN','A']);

        walk(ch);

}
const isBlank = h => !h.replace(/<br\s*\/?>/gi,'').replace(/<[^>]+>/g,'').replace(/&nbsp;|\u00a0/g,'').trim();
function caretEnd(node){ const r = document.createRange(); r.selectNodeContents(node); r.collapse(false); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }

function blurEditing(){ const a = document.activeElement; if (a && a !== document.body && (world.contains(a) || $('#crumbs').contains(a))) a.blur(); }

let fmtFor = null;
function enterEdit(id, ev){

  const before = snapshot(), html0 = c.html || '';

  }

  fmtFor = id; fmt.classList.add('show'); positionFormatBar(); refreshFmtState();

  const onPaste = e => { e.preventDefault(); e.stopPropagation(); document.execCommand('insertText', false, e.clipboardData.getData('text/plain')); };
  const onKey = e => { if (e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); body.blur(); } };

    body.contentEditable = 'false'; el.classList.remove('editing');

    const clean = sanitize(body.innerHTML), empty = isBlank(clean);
    c.html = empty ? '' : clean;
    const b = cur();
    if (fresh.has(id) && empty && b.cards[id]){
      fresh.delete(id); hist.past.pop(); updateUndoUI();
      if (c.parent && b.cards[c.parent]) b.cards[c.parent].children = b.cards[c.parent].children.filter(x => x !== id);
      delete b.cards[id]; b.links = b.links.filter(l => l.from !== id && l.to !== id); sel.delete(id); render();
    } else {

  body.addEventListener('keydown', onKey); body.addEventListener('blur', onBlur);
}
function positionFormatBar(){

  const r = el.getBoundingClientRect(), bw = fmt.offsetWidth, bh = fmt.offsetHeight;
  let y = r.top - bh - 10; if (y < 72) y = r.bottom + 10;
  fmt.style.left = clamp(r.left, 8, innerWidth - bw - 8) + 'px'; fmt.style.top = clamp(y, 8, innerHeight - bh - 8) + 'px';
}
function refreshFmtState(){

  fmt.querySelectorAll('[data-cmd]').forEach(b => {
    const c = b.dataset.cmd; let on = false;
    try { on = c === 'heading' ? /h[1-3]/i.test(document.queryCommandValue('formatBlock') || '') : document.queryCommandState(c); } catch {}

fmt.addEventListener('pointerdown', e => e.preventDefault());
fmt.addEventListener('mousedown', e => e.preventDefault());
fmt.addEventListener('click', e => {

  if (c === 'heading'){ const v = (document.queryCommandValue('formatBlock') || '').toLowerCase(); document.execCommand('formatBlock', false, /h[1-3]/.test(v) ? 'div' : 'h3'); }

function inlineEdit(node, value, onCommit){
  if (!node || node.isContentEditable) return;
  const before = snapshot(); let cancelled = false;
  node.contentEditable = 'true'; node.focus({preventScroll:true});
  const r = document.createRange(); r.selectNodeContents(node); const s = getSelection(); s.removeAllRanges(); s.addRange(r);
  const kd = e => { e.stopPropagation(); if (e.key === 'Enter'){ e.preventDefault(); node.blur(); } else if (e.key === 'Escape'){ e.preventDefault(); cancelled = true; node.blur(); } };
  const ps = e => { e.preventDefault(); document.execCommand('insertText', false, e.clipboardData.getData('text/plain').replace(/\s+/g, ' ')); };
  const bl = () => {
    node.removeEventListener('keydown', kd); node.removeEventListener('blur', bl); node.removeEventListener('paste', ps);
    node.contentEditable = 'false'; getSelection().removeAllRanges();
    const v = node.textContent.replace(/\s+/g, ' ').trim().slice(0, 80);
    if (!cancelled && v && v !== value){ pushPast(before); onCommit(v); node.textContent = v; saveSoon(); renderCrumbs(); }
    else node.textContent = value;
    drawLinks();
  };
  node.addEventListener('keydown', kd); node.addEventListener('blur', bl); node.addEventListener('paste', ps);
}

  else if (c.type === 'column') inlineEdit(el.querySelector('.col-title'), c.title || 'Column', v => c.title = v);
  else if (c.type === 'link') inlineEdit(el.querySelector('.lk-title'), c.title || hostOf(c.url), v => c.title = v);

/* ================= Card operations ================= */
function defaults(type){
  if (type === 'note') return {html:''};
  if (type === 'todo') return {title:'', items:[{id:uid(), text:'', done:false}]};
  if (type === 'column') return {title:'Column', children:[]};
  return {};
}
function addCard(type, p, extra = {}, opts = {}){
  const b = cur(); commit();
  const w = W[type];
  const c = {id:uid(), type, x:Math.round(p.x - w / 2), y:Math.round(p.y - 24), w, z:maxZ(b) + 1, color:null, ...defaults(type), ...extra};
  if (type === 'board') c.target = newBoard('Untitled board', b.id).id;
  b.cards[c.id] = c; sel.clear(); sel.add(c.id); selLink = null;
  render([c.id]); saveSoon();
  if (opts.edit === false) return c;
  requestAnimationFrame(() => {
    const el = elOf(c.id); if (!el) return;
    if (type === 'note'){ fresh.add(c.id); enterEdit(c.id); }
    else if (type === 'todo') el.querySelector('.todo-title')?.focus({preventScroll:true});
    else if (type === 'board' || type === 'column') renameCard(c.id);
  });
  return c;
}
async function createCard(type, p){
  p = p || centerWorld();
  if (type === 'image') return pickImages(p);
  if (type === 'link'){ const url = await askLink(); if (url) addCard('link', p, {url, title:''}, {edit:false}); return; }
  addCard(type, p);
}
function askLink(){
  return modal({
    title:'Add a link',
    html:`<p>Paste a web address. It becomes a card with the site’s icon and a one-tap way to open it.</p><label class="field"><input id="m-url" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://"></label>`,
    onOpen: ov => setTimeout(() => ov.querySelector('#m-url').focus(), 60),
    actions:[{label:'Cancel', value:null}, {label:'Add link', kind:'primary', primary:true, fn: ov => {
      const inp = ov.querySelector('#m-url'), u = normUrl(inp.value);
      if (!isUrl(u)){ const f = inp.parentElement; f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake'); inp.focus(); return false; }
      return u;
    }}]
  });
}
function pickImages(p){
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*'; inp.multiple = true;
  inp.onchange = () => { if (inp.files.length) addImageFiles([...inp.files], p); }; inp.click();
}
function readDataURL(f){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(f); }); }
function imgDims(url){ return new Promise(res => { const im = new Image(); im.onload = () => res({w:im.naturalWidth || 400, h:im.naturalHeight || 300}); im.onerror = () => res({w:400, h:300}); im.src = url; }); }
async function processImage(f){
  if (/gif|svg/.test(f.type)){ const url = await readDataURL(f); return {url, ...(await imgDims(url))}; }
  let bmp; try { bmp = await createImageBitmap(f); } catch { const url = await readDataURL(f); return {url, ...(await imgDims(url))}; }
  const k = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
  const w = Math.max(1, Math.round(bmp.width * k)), h = Math.max(1, Math.round(bmp.height * k));
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const cx = cv.getContext('2d'); cx.imageSmoothingQuality = 'high'; cx.drawImage(bmp, 0, 0, w, h); bmp.close?.();
  let url = cv.toDataURL('image/webp', .86); if (!url.startsWith('data:image/webp')) url = cv.toDataURL('image/jpeg', .88);
  return {url, w, h};
}
async function addImageFiles(files, p){
  const b = cur(), made = []; let pushed = false;
  for (let i = 0; i < files.length; i++){
    let res; try { res = await processImage(files[i]); } catch { continue; }
    const id = uid();
    try { await imgPut(id, res.url); } catch { toast('Not enough storage for that image'); continue; }
    imgCache.set(id, res.url);
    if (!pushed){ commit(); pushed = true; }
    const w = Math.round(clamp(res.w / 2, 160, 320)), h = w * res.h / res.w;
    const c = {id:uid(), type:'image', x:Math.round(p.x - w / 2 + i * 26), y:Math.round(p.y - h / 2 + i * 26), w, z:maxZ(b) + 1, color:null, imageId:id, iw:res.w, ih:res.h};
    b.cards[c.id] = c; made.push(c.id);
  }
  if (!made.length) return;
  if (b !== cur()){ saveSoon(); return; }
  sel.clear(); made.forEach(i => sel.add(i)); render(made); saveSoon();
}
function deleteBoardRec(bid){
  const bd = S.boards[bid]; if (!bd) return;
  for (const c of Object.values(bd.cards)) if (c.type === 'board') deleteBoardRec(c.target);
  delete S.boards[bid];
}
function deleteCards(ids){
  const b = cur(); ids = ids.filter(id => b.cards[id]); if (!ids.length) return;
  commit(); let n = 0;
  const kill = id => {
    const c = b.cards[id]; if (!c) return;
    if (c.type === 'column') [...c.children].forEach(kill);
    if (c.type === 'board') deleteBoardRec(c.target);
    if (c.parent && b.cards[c.parent]) b.cards[c.parent].children = b.cards[c.parent].children.filter(x => x !== id);
    delete b.cards[id]; n++;
  };
  ids.forEach(kill);
  b.links = b.links.filter(l => b.cards[l.from] && b.cards[l.to]);
  sel.clear(); render(); saveSoon();
  toast(`Deleted ${n} card${n > 1 ? 's' : ''}`, {label:'Undo', fn:undo});
}
function cloneBoard(bid, parentId){
  const s = S.boards[bid], nb = newBoard(s ? s.title : 'Untitled board', parentId); if (!s) return nb.id;
  nb.view = {...s.view}; const map = {};
  for (const c of Object.values(s.cards)) if (!c.parent || !s.cards[c.parent]) cloneCard(c, s.cards, nb, 0, 0, null, map);
  nb.links = s.links.filter(l => map[l.from] && map[l.to]).map(l => ({id:uid(), from:map[l.from], to:map[l.to]}));
  return nb.id;
}
function cloneCard(c, src, dst, dx, dy, parent, map){
  const n = JSON.parse(JSON.stringify(c)); n.id = uid(); map[c.id] = n.id;
  n.x = Math.round((c.x || 0) + dx); n.y = Math.round((c.y || 0) + dy); n.parent = parent || null; n.w = c.w || W[c.type];
  if (n.type === 'todo') n.items = (n.items || []).map(i => ({...i, id:uid()}));

  items.push({label:'Duplicate', icon:'copy', kbd:'Ctrl D', fn:() => duplicate(ids)});
  if (!c.parent) items.push({label:'Bring to front', icon:'front', fn:() => reorder(ids, true)}, {label:'Send to back', icon:'back', fn:() => reorder(ids, false)});
  items.push({sep:true}, {label:ids.length > 1 ? `Delete ${ids.length} cards` : 'Delete', icon:'trash', kbd:'Del', danger:true, fn:() => deleteCards(ids)});
  openMenu(items, x, y);
}
function openBgMenu(x, y){
  const p = screenToWorld(x, y);
  openMenu([...TOOLS.map(([t, l, k]) => ({label:`Add ${l.toLowerCase()}`, icon:t, kbd:k, fn:() => createCard(t, p)})), {sep:true},
    {label:'Select all', icon:'select', kbd:'Ctrl A', fn:selectAll}, {label:'Fit to screen', icon:'fit', kbd:'Ctrl 0', fn:() => fit()}], x, y);
}
canvas.addEventListener('contextmenu', e => {
  e.preventDefault(); if (ctx.classList.contains('show') && e.pointerType === 'touch') return;
  if (gesture){ gesture.cancel?.(); gesture = null; }
  const card = e.target.closest('.card'), lh = e.target.closest('.link-hit');
  if (card && !e.target.closest('[contenteditable="true"],input,textarea')) openCardMenu(card.dataset.id, e.clientX, e.clientY);
  else if (lh){ selectLink(lh.dataset.id); openMenu([{label:'Reverse direction', icon:'swap', fn:() => reverseLink(lh.dataset.id)}, {sep:true}, {label:'Delete connection', icon:'trash', danger:true, kbd:'Del', fn:() => removeLink(lh.dataset.id)}], e.clientX, e.clientY); }
  else if (!card) openBgMenu(e.clientX, e.clientY);
});

/* ---------- clipboard & drop ---------- */
document.addEventListener('copy', e => {
  if (isEditingAny() || !sel.size) return;
  const b = cur(), ids = [...sel], pl = {roots:ids, cards:{}};
  const add = id => { const c = b.cards[id]; if (!c) return; pl.cards[id] = c; if (c.type === 'column') c.children.forEach(add); };
  ids.forEach(add); e.clipboardData.setData('text/plain', 'tessera:' + JSON.stringify(pl)); e.preventDefault();
  toast(`Copied ${ids.length} card${ids.length > 1 ? 's' : ''}`);
});
document.addEventListener('paste', e => {
  if (isEditingAny() || document.querySelector('.overlay')) return;
  const dt = e.clipboardData; if (!dt) return; const p = pointerWorldOrCenter();
  const files = [...dt.files].filter(f => f.type.startsWith('image/'));
  if (files.length){ e.preventDefault(); addImageFiles(files, p); return; }
  const text = dt.getData('text/plain'); if (!text) return; e.preventDefault();
  if (text.startsWith('tessera:')){ try { pasteCards(JSON.parse(text.slice(8)), p); } catch {} return; }
  const t = text.trim(), u = normUrl(t);
  if (!/\s/.test(t) && isUrl(u) && /[./]/.test(t)) addCard('link', p, {url:u, title:''}, {edit:false});
  else addCard('note', p, {html:esc(t).replace(/\n/g, '<br>')}, {edit:false});
});
canvas.addEventListener('dragover', e => { e.preventDefault(); canvas.classList.add('file-over'); });
canvas.addEventListener('dragleave', e => { if (!e.relatedTarget || !canvas.contains(e.relatedTarget)) canvas.classList.remove('file-over'); });
canvas.addEventListener('drop', e => {
  e.preventDefault(); canvas.classList.remove('file-over');
  const p = screenToWorld(e.clientX, e.clientY), files = [...e.dataTransfer.files].filter(f => f.type.startsWith('image/'));
  if (files.length) return addImageFiles(files, p);
  const u = (e.dataTransfer.getData('text/uri-list') || e.dataTransfer.getData('text/plain') || '').trim().split('\n')[0].trim();
  if (isUrl(u)) addCard('link', p, {url:u, title:''}, {edit:false}); else if (u) addCard('note', p, {html:esc(u)}, {edit:false});
});

/* ---------- keyboard ---------- */
let lastNudge = 0;
document.addEventListener('keydown', e => {
  if (document.querySelector('.overlay')) return;
  const mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
  if (mod && (k === '=' || k === '+')){ e.preventDefault(); zoomBy(1.25); return; }
  if (mod && k === '-'){ e.preventDefault(); zoomBy(1 / 1.25); return; }
  if (mod && k === '0'){ e.preventDefault(); fit(); return; }
  if (mod && k === 's'){ e.preventDefault(); exportBackup(); return; }
  if (isEditingAny()) return;
  if (mod && k === 'z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && k === 'y'){ e.preventDefault(); redo(); return; }
  if (mod && k === 'd'){ e.preventDefault(); duplicate([...sel]); return; }
  if (mod && k === 'a'){ e.preventDefault(); selectAll(); return; }
  if (mod || e.altKey) return;
  if (k === 'delete' || k === 'backspace'){ if (selLink){ e.preventDefault(); removeLink(selLink); } else if (sel.size){ e.preventDefault(); deleteCards([...sel]); } return; }
  if (k === 'escape'){ hideMenus(); if (sel.size || selLink) clearSelection(); else if (cur().parent) openBoard(cur().parent); return; }
  if (k === 'enter' && sel.size === 1){ const c = findCard([...sel][0]); if (c?.type === 'note'){ e.preventDefault(); enterEdit(c.id); } else if (c?.type === 'board'){ e.preventDefault(); openBoard(c.target); } return; }
  if (k === ' '){ e.preventDefault(); if (!spaceDown){ spaceDown = true; canvas.classList.add('grab'); } return; }
  if (k.startsWith('arrow') && sel.size){
    e.preventDefault(); const now = Date.now(); if (now - lastNudge > 800) commit(); lastNudge = now;
    const d = e.shiftKey ? 10 : 1, dx = k === 'arrowleft' ? -d : k === 'arrowright' ? d : 0, dy = k === 'arrowup' ? -d : k === 'arrowdown' ? d : 0;
    for (const id of sel){ const c = findCard(id); if (c && !c.parent){ c.x += dx; c.y += dy; const el = elOf(id); el.style.left = c.x + 'px'; el.style.top = c.y + 'px'; } }
    drawLinks(); saveSoon(); return;
  }
  const tool = TOOLS.find(t => t[2].toLowerCase() === k);
  if (tool && !e.repeat){ e.preventDefault(); createCard(tool[0], pointerWorldOrCenter()); }
});
document.addEventListener('keyup', e => { if (e.key === ' '){ spaceDown = false; canvas.classList.remove('grab'); } });
window.addEventListener('blur', () => { spaceDown = false; canvas.classList.remove('grab'); });

/* ================= Modals, toasts, lightbox ================= */
function modal({title, html, actions, onOpen, dismissable = true, eyebrow = ''}){
  return new Promise(res => {
    const ov = document.createElement('div'); ov.className = 'overlay';
    ov.innerHTML = `<div class="modal glass" role="dialog" aria-modal="true">${eyebrow ? `<div class="eyebrow">${eyebrow}</div>` : ''}<h2>${title}</h2><div class="m-body">${html}</div><div class="m-actions">${actions.map((a, i) => `<button class="btn ${a.kind || ''}" data-i="${i}">${a.label}</button>`).join('')}</div></div>`;
    document.body.appendChild(ov); requestAnimationFrame(() => ov.classList.add('show'));
    let done = false;
    const close = v => { if (done) return; done = true; ov.classList.remove('show'); setTimeout(() => ov.remove(), 220); document.removeEventListener('keydown', kd, true); res(v); };
    ov.addEventListener('click', e => {
      const b = e.target.closest('[data-i]');
      if (b){ const a = actions[+b.dataset.i]; const r = a.fn ? a.fn(ov) : a.value; if (r === false) return; close(r === undefined ? (a.value ?? null) : r); }
      else if (e.target === ov && dismissable) close(null);
    });
    const kd = e => {
      if (e.key === 'Escape' && dismissable){ e.preventDefault(); e.stopPropagation(); close(null); }
      else if (e.key === 'Enter'){ const i = actions.findIndex(a => a.primary); if (i > -1){ e.preventDefault(); ov.querySelector(`[data-i="${i}"]`).click(); } }
    };
    document.addEventListener('keydown', kd, true);
    if (onOpen) onOpen(ov); else setTimeout(() => ov.querySelector('.btn.primary')?.focus({preventScroll:true}), 60);
  });
}
function toast(msg, action, ms = 4200){
  const t = document.createElement('div'); t.className = 'toast glass' + (action ? ' has-act' : '');
  t.innerHTML = `<span>${esc(msg)}</span>${action ? `<button>${esc(action.label)}</button>` : ''}`;
  $('#toasts').appendChild(t); requestAnimationFrame(() => t.classList.add('show'));
  const kill = () => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); };
  if (action) t.querySelector('button').onclick = () => { action.fn(); kill(); };
  setTimeout(kill, ms);
}
async function lightbox(c){
  const u = await loadImg(c.imageId); if (!u) return;
  const ov = document.createElement('div'); ov.className = 'overlay lb';
  ov.innerHTML = `<img alt=""><button class="ib lb-x" aria-label="Close">${ico('x',18)}</button>`; ov.querySelector('img').src = u;
  document.body.appendChild(ov); requestAnimationFrame(() => ov.classList.add('show'));
  const close = () => { ov.classList.remove('show'); setTimeout(() => ov.remove(), 220); document.removeEventListener('keydown', kd, true); };
  const kd = e => { if (e.key === 'Escape'){ e.stopPropagation(); close(); } };
  document.addEventListener('keydown', kd, true); ov.addEventListener('click', close);
}
async function downloadImage(c){
  const u = await loadImg(c.imageId); if (!u) return;
  const ext = (u.match(/^data:image\/(\w+)/) || [, 'png'])[1].replace('jpeg', 'jpg');
  const a = document.createElement('a'); a.href = u; a.download = `tessera-image.${ext}`; document.body.appendChild(a); a.click(); a.remove();
}

async function storageInfo(first = false){
  let usage = '', persisted = false;
  try { const est = await navigator.storage?.estimate?.(); if (est && est.usage != null) usage = fmtBytes(est.usage) + ' used'; } catch {}
  try { persisted = !!(await navigator.storage?.persisted?.()); } catch {}
  const html = `${!storageOK ? `<div class="warnbox">This browser isn’t letting Tessera save right now (private window or blocked storage). Anything you make will be lost when you close the page — export a backup before leaving.</div>` : ''}
<p>Tessera has no accounts and no cloud. Everything you create is kept privately in this browser, on this device only.</p>
<ul class="facts">
<li>${ico('device',18)}<div><b>Not synced</b>Boards don’t follow you to other devices, browsers or browser profiles.</div></li>
<li>${ico('trash',18)}<div><b>Can be erased</b>Clearing browsing data for this site, uninstalling the app or using a private window will remove your boards.</div></li>
<li>${ico('download',18)}<div><b>Back up regularly</b>Export a backup file from the ⋯ menu (Ctrl S). Import it here or on any other device to restore.</div></li>
</ul>
${first ? '' : `<div class="stat"><span>Last backup</span><b>${S.meta.lastExport ? relTime(S.meta.lastExport) : 'Never'}</b></div><div class="stat"><span>Storage</span><b>${usage || 'Unknown'}${persisted ? ' · protected' : ''}</b></div>`}`;
  const actions = first ? [{label:'I understand', kind:'primary', primary:true, value:true}]
    : [{label:'Close', value:null}, {label:'Export backup', kind:'primary', primary:true, fn:() => { exportBackup(); }}];
  await modal({title:first ? 'Your boards stay on this device' : 'Stored on this device', eyebrow:first ? 'Before you begin' : 'Storage & privacy', html, actions, dismissable:!first});
  if (first){ S.meta.welcomed = true; saveSoon(); try { await navigator.storage?.persist?.(); } catch {} }
}
function shortcuts(){
  const rows = [['New note / to-do / link','<kbd>N</kbd> <kbd>T</kbd> <kbd>L</kbd>'],['New image / board / column','<kbd>I</kbd> <kbd>B</kbd> <kbd>C</kbd>'],['Quick note','Double-click canvas'],['Pan','Scroll · <kbd>Space</kbd> + drag'],['Zoom','<kbd>Ctrl</kbd> + scroll · pinch'],['Fit to screen','<kbd>Ctrl</kbd> <kbd>0</kbd>'],['Undo / redo','<kbd>Ctrl</kbd> <kbd>Z</kbd> · <kbd>Ctrl</kbd> <kbd>⇧</kbd> <kbd>Z</kbd>'],['Duplicate','<kbd>Ctrl</kbd> <kbd>D</kbd>'],['Copy / paste cards','<kbd>Ctrl</kbd> <kbd>C</kbd> · <kbd>Ctrl</kbd> <kbd>V</kbd>'],['Edit note / open board','<kbd>Enter</kbd>'],['Delete','<kbd>Del</kbd>'],['Back to parent board','<kbd>Esc</kbd>'],['Export backup','<kbd>Ctrl</kbd> <kbd>S</kbd>']];
  modal({title:'Keyboard shortcuts', html:`<div class="kbd-grid">${rows.map(r => `<span>${r[0]}</span><span>${r[1]}</span>`).join('')}</div>`, actions:[{label:'Done', kind:'primary', primary:true}]});
}
async function exportBackup(){
  try {
    const images = {}; for (const id of usedImageIds()){ const u = await loadImg(id); if (u) images[id] = u; }
    S.meta.lastExport = Date.now();
    const data = {app:'tessera', format:1, exportedAt:new Date().toISOString(), state:S, images};
    const url = URL.createObjectURL(new Blob([JSON.stringify(data)], {type:'application/json'}));
    const a = document.createElement('a'); a.href = url; a.download = `tessera-backup-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000);
    saveSoon(); toast('Backup exported');
  } catch { toast('Export failed — please try again'); }
}
function importBackup(){
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return; let data;
    try { data = JSON.parse(await f.text()); } catch { toast('That file isn’t a valid backup'); return; }
    if (data?.app !== 'tessera' || !data.state?.boards?.[data.state.rootId]){ toast('That file isn’t a Tessera backup'); return; }
    const n = Object.keys(data.state.boards).length;
    const ok = await modal({title:'Replace your boards?', html:`<p>This replaces everything on this device with the backup from <b>${esc(new Date(data.exportedAt).toLocaleString())}</b> (${n} board${n > 1 ? 's' : ''}).</p><p>Export a backup first if you want to keep what’s here now.</p>`,
      actions:[{label:'Cancel', value:false}, {label:'Replace', kind:'danger', primary:true, value:true}]});
    if (!ok) return;
    try {
      await idbClear('img'); memImages.clear(); imgCache.clear();
      for (const [id, u] of Object.entries(data.images || {})) await imgPut(id, u);
    } catch { toast('Not enough storage to restore every image'); }
    S = data.state; S.meta = {...(S.meta || {}), welcomed:true};
    for (const b of Object.values(S.boards)){ b.view = b.view || {x:0,y:0,s:1,set:false}; b.links = b.links || []; }
    curId = S.rootId; hist.past = []; hist.future = []; sel.clear(); selLink = null;
    const needFit = !cur().view.set; render(); if (needFit) fit(false); await saveNow(); toast('Backup restored');
  };
  inp.click();
}
async function eraseAll(){
  const ok = await modal({title:'Erase everything?', html:'<p>Every board, card and image on this device will be permanently deleted. This can’t be undone.</p><p>Export a backup first if you might want them back.</p>',
    actions:[{label:'Cancel', value:false}, {label:'Erase everything', kind:'danger', value:true}]});
  if (!ok) return;
  try { await idbClear('img'); await idbClear('kv'); } catch {}
  memImages.clear(); imgCache.clear(); seed(); S.meta.welcomed = true; curId = S.rootId;
  hist.past = []; hist.future = []; sel.clear(); render(); fit(false); saveNow(); toast('Everything erased');
}
let deferredInstall = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; });
function openMoreMenu(){
  const r = $('#moreBtn').getBoundingClientRect();
  const items = [{label:'Export backup', icon:'download', kbd:'Ctrl S', fn:exportBackup}, {label:'Import backup…', icon:'upload', fn:importBackup}, {sep:true},
    {label:'Storage & privacy', icon:'shield', fn:() => storageInfo()}, {label:'Keyboard shortcuts', icon:'keyboard', fn:shortcuts}];
  if (deferredInstall) items.push({label:'Install app', icon:'install', fn:async () => { deferredInstall.prompt(); try { await deferredInstall.userChoice; } catch {} deferredInstall = null; }});
  items.push({sep:true}, {label:'Erase everything…', icon:'trash', danger:true, fn:eraseAll});
  openMenu(items, r.right, r.bottom + 8, true);
}

/* ================= Chrome wiring ================= */
document.querySelectorAll('[data-ico]').forEach(n => n.innerHTML = ico(n.dataset.ico, +n.dataset.s || 18));
const tap = (id, fn) => $(id).addEventListener('click', e => { e.currentTarget.blur(); fn(e); });
tap('#undoBtn', undo); tap('#redoBtn', redo);
tap('#zoomIn', () => zoomBy(1.25)); tap('#zoomOut', () => zoomBy(1 / 1.25));
tap('#zl', () => zoomTo(1)); tap('#fitBtn', () => fit());
tap('#moreBtn', () => ctx.classList.contains('show') ? hideMenus() : openMoreMenu());
tap('#chip', () => storageInfo());
$('#crumbs').addEventListener('click', e => {
  const c = e.target.closest('.crumb'); if (!c) return;
  if (c.dataset.b === curId){ const sp = c.querySelector('span'); if (!sp.isContentEditable) inlineEdit(sp, cur().title, v => { cur().title = v; }); }
  else openBoard(c.dataset.b);
});
window.addEventListener('resize', () => { if (fmtFor) positionFormatBar(); hideMenus(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveNow(); });
window.addEventListener('pagehide', saveNow);

/* ================= Boot ================= */
async function init(){
  db = await openDB(); storageOK = !!db;
  let st = null; try { st = db ? await kvGet('state') : null; } catch {}
  if (st && st.boards && st.boards[st.rootId]) S = st; else seed();
  S.meta = S.meta || {};
  for (const b of Object.values(S.boards)){ b.view = b.view || {x:0,y:0,s:1,set:false}; b.links = b.links || []; }
  curId = S.boards[S.meta.lastBoard] ? S.meta.lastBoard : S.rootId;
  const needFit = !cur().view.set;
  render(); if (needFit) fit(false);
  stage.classList.add('in'); updateStorageChip();
  document.fonts?.ready?.then(() => { world.querySelectorAll('.ti-text').forEach(autosize); drawLinks(); if (needFit) fit(false); });
  if (!storageOK) toast('Storage is blocked here — changes won’t be saved', {label:'Details', fn:() => storageInfo()}, 9000);
  if (!S.meta.welcomed) setTimeout(() => storageInfo(true), 500);
  else {
    const total = Object.values(S.boards).reduce((n, b) => n + Object.keys(b.cards).length, 0);
    if (total > 8 && Date.now() - (S.meta.lastExport || 0) > 7 * 864e5) setTimeout(() => toast('It’s been a while since your last backup', {label:'Export', fn:exportBackup}, 8000), 1400);
  }
  gcImages();
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && window.isSecureContext){
    try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch {}
  }
}
init();
})();
