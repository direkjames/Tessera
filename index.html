<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">

<style>
:root{
  color-scheme:light;
  --bg:#f5f3ee;--surface:#ffffff;--surface-2:#f4f2ed;--surface-3:#eae7e0;
  --line:rgba(30,26,18,.08);--line-2:rgba(30,26,18,.12);--line-3:rgba(30,26,18,.22);
  --text:#1b1a17;--text-2:#5e5b55;--text-3:#9b978f;
  --accent:#6d5ce8;--accent-strong:#5a47e0;--accent-soft:rgba(109,92,232,.12);--accent-glow:rgba(109,92,232,.35);--on-accent:#fff;
  --primary-a:#8576f3;--primary-b:#6450ea;
  --danger:#e5484d;--danger-soft:rgba(229,72,77,.1);--ok:#2fb37f;--ok-soft:rgba(47,179,127,.14);--warn:#e38b2c;--warn-soft:rgba(227,139,44,.14);
  --shadow:0 1px 2px rgba(30,26,18,.06),0 8px 24px -12px rgba(30,26,18,.2);
  --shadow-lift:0 30px 60px -18px rgba(30,26,18,.38);
  --glass:rgba(255,255,255,.78);--glass-border:rgba(30,26,18,.08);--glass-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 16px 40px -18px rgba(30,26,18,.28);
  --menu-bg:rgba(255,255,255,.94);--menu-solid:#fff;--modal-bg:rgba(255,255,255,.97);--overlay-bg:rgba(40,35,25,.22);
  --hover:rgba(30,26,18,.055);--hover-soft:rgba(30,26,18,.025);--input-bg:#f6f4ef;
  --dots:rgba(30,26,18,.14);--vignette:rgba(120,105,80,.07);
  --link:rgba(30,26,18,.3);--link-hover:rgba(30,26,18,.6);--link-arrow:rgba(30,26,18,.5);
  --col-bg:#eeebe5;--tile-top:#ffffff;--tile-base:#ebe8e1;--tint-amt:9%;--chk-border:rgba(30,26,18,.25);--sel-text:rgba(109,92,232,.22);--gridline:rgba(30,26,18,.07);
  --ease:cubic-bezier(.22,1,.36,1);
  --font:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --serif:'Instrument Serif',ui-serif,Georgia,serif;
}
:root[data-theme=dark]{
  color-scheme:dark;
  --bg:#08080a;--surface:#141417;--surface-2:#1a1a1e;--surface-3:#242429;
  --line:rgba(255,255,255,.065);--line-2:rgba(255,255,255,.11);--line-3:rgba(255,255,255,.2);
  --text:#ececef;--text-2:#a3a3ad;--text-3:#6c6c76;
  --accent:#a99bff;--accent-strong:#8f7dff;--accent-soft:rgba(169,155,255,.14);--accent-glow:rgba(169,155,255,.45);--on-accent:#0d0a1c;
  --primary-a:#bdb2ff;--primary-b:#9584ff;
  --danger:#ff6d84;--danger-soft:rgba(255,109,132,.12);--ok:#62d6a9;--ok-soft:rgba(98,214,169,.15);--warn:#ffb35c;--warn-soft:rgba(255,179,92,.14);
  --shadow:0 1px 0 rgba(255,255,255,.035) inset,0 1px 2px rgba(0,0,0,.4),0 10px 30px -12px rgba(0,0,0,.7);
  --shadow-lift:0 30px 60px -14px rgba(0,0,0,.9);
  --glass:rgba(18,18,22,.76);--glass-border:rgba(255,255,255,.11);--glass-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 18px 40px -16px rgba(0,0,0,.85);
  --menu-bg:rgba(22,22,27,.93);--menu-solid:#16161b;--modal-bg:rgba(20,20,25,.96);--overlay-bg:rgba(4,4,6,.6);
  --hover:rgba(255,255,255,.065);--hover-soft:rgba(255,255,255,.03);--input-bg:rgba(0,0,0,.35);
  --dots:rgba(255,255,255,.08);--vignette:rgba(0,0,0,.5);
  --link:rgba(255,255,255,.3);--link-hover:rgba(255,255,255,.6);--link-arrow:rgba(255,255,255,.5);
  --col-bg:#0f0f12;--tile-top:#1c1c22;--tile-base:#121216;--tint-amt:8%;--chk-border:rgba(255,255,255,.2);--sel-text:rgba(169,155,255,.35);--gridline:rgba(255,255,255,.045);
}
[data-color=violet]{--tint:#7c6cf0}[data-color=sky]{--tint:#3b8de0}[data-color=mint]{--tint:#20a678}[data-color=rose]{--tint:#e2557a}[data-color=amber]{--tint:#ea822e}[data-color=slate]{--tint:#7d8796}
[data-theme=dark] [data-color=violet]{--tint:#a99bff}[data-theme=dark] [data-color=sky]{--tint:#6fb7ff}[data-theme=dark] [data-color=mint]{--tint:#62d6a9}[data-theme=dark] [data-color=rose]{--tint:#ff7b9c}[data-theme=dark] [data-color=amber]{--tint:#ff9f5a}[data-theme=dark] [data-color=slate]{--tint:#9aa4b2}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
::selection{background:var(--sel-text)}
svg{display:block;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
body.is-dragging,body.is-dragging *{cursor:grabbing!important}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}

/* ---------- Canvas ---------- */
#canvas{position:fixed;inset:0;touch-action:none;overflow:hidden;background-color:var(--bg);background-image:radial-gradient(circle at center,var(--dots) 1px,transparent 1.3px);background-size:24px 24px}
#canvas::after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(130% 95% at 50% 40%,transparent 55%,var(--vignette));z-index:3}
#canvas.grab{cursor:grab}#canvas.panning{cursor:grabbing}
#canvas.file-over::before{content:'';position:absolute;inset:12px;border:1.5px dashed var(--accent);border-radius:24px;background:var(--accent-soft);z-index:6;pointer-events:none}
#stage{position:absolute;inset:0;transform-origin:50% 50%}
#stage.in{animation:stageIn .45s var(--ease)}#stage.out{animation:stageOut .45s var(--ease)}
@keyframes stageIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes stageOut{from{opacity:0;transform:scale(1.06)}to{opacity:1;transform:none}}
#world{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0;user-select:none;-webkit-user-select:none}
#canvas[data-bg=grid]{background-image:linear-gradient(var(--gridline) 1px,transparent 1px),linear-gradient(90deg,var(--gridline) 1px,transparent 1px)}
#canvas[data-bg=lines]{background-image:linear-gradient(var(--gridline) 1px,transparent 1px)}
#canvas[data-bg=plain]{background-image:none}
#links{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none;z-index:1}
#labels,#guides{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none}
#labels{z-index:1}#guides{z-index:100000}
.link-line.dashed{stroke-dasharray:7 6}.link-line.dotted{stroke-dasharray:.1 5.5;stroke-width:2.4}
.link-line{fill:none;stroke:var(--link);stroke-width:1.6;stroke-linecap:round;transition:stroke .15s;pointer-events:none}
.link-line.sel,.link-line.temp{stroke:var(--accent)}
.link-line.temp{stroke-dasharray:5 6}
.link-hit{fill:none;stroke:transparent;stroke-width:16;pointer-events:stroke;cursor:pointer}
.link-hit:hover+.link-line{stroke:var(--link-hover)}
.link-hit:hover+.link-line.sel{stroke:var(--accent)}
.mk{fill:none;stroke:var(--link-arrow);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.mk.sel{stroke:var(--accent)}

/* ---------- Cards ---------- */
.card{position:absolute;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);color:var(--text);transition:box-shadow .22s var(--ease),border-color .2s,background .2s}
.card[data-color]{background:color-mix(in srgb,var(--tint) var(--tint-amt),var(--surface))}
.card[data-color]::before{content:'';position:absolute;left:-1px;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--tint);box-shadow:0 0 12px color-mix(in srgb,var(--tint) 45%,transparent)}
.card:hover{border-color:var(--line-2)}
.card.selected{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),var(--shadow)}
.card.editing{border-color:var(--accent-strong)}
.card.dragging{box-shadow:0 0 0 1px var(--line-2),var(--shadow-lift);transition:none}
.card.selected.dragging{box-shadow:0 0 0 3px var(--accent-soft),var(--shadow-lift)}
.card.link-target{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft),0 0 34px -4px var(--accent-glow)}
.card.pop{animation:pop .4s var(--ease)}
.card.flash{animation:flash 1.5s var(--ease)}
@keyframes pop{from{opacity:0;transform:scale(.93) translateY(6px)}to{opacity:1;transform:none}}
@keyframes flash{0%,40%{box-shadow:0 0 0 6px var(--accent-soft),0 0 40px -6px var(--accent-glow),var(--shadow)}100%{box-shadow:0 0 0 3px var(--accent-soft),var(--shadow)}}

.ch{position:absolute;right:-9px;top:50%;width:16px;height:16px;margin-top:-8px;border-radius:50%;background:var(--surface);border:1.5px solid var(--accent);opacity:0;transition:opacity .15s,transform .2s var(--ease);cursor:crosshair;z-index:2}
.ch::after{content:'';position:absolute;inset:3.5px;border-radius:50%;background:var(--accent)}
.ch:hover{transform:scale(1.3)}
.card:hover>.ch,.card.selected>.ch{opacity:1}
.card.dragging>.ch,.card.editing>.ch{opacity:0}
.rz{position:absolute;right:-6px;bottom:-6px;width:13px;height:13px;border-radius:4px;background:var(--surface-3);border:1.5px solid var(--accent);opacity:0;cursor:ew-resize;transition:opacity .15s;z-index:2}
.card.selected>.rz{opacity:1}

/* note */
.note-body{padding:14px 16px 15px;font-size:14px;line-height:1.6;min-height:50px;outline:none;overflow-wrap:anywhere}
.note-body[contenteditable=true]{cursor:text;user-select:text;-webkit-user-select:text}
.note-body:empty::before{content:'Write something…';color:var(--text-3)}
.note-body h1,.note-body h2,.note-body h3{font-family:var(--serif);font-weight:400;font-size:25px;line-height:1.15;margin:2px 0 8px;letter-spacing:-.005em}
.note-body ul,.note-body ol{margin:4px 0;padding-left:20px}
.note-body p{margin:0}.note-body a{color:var(--accent)}

/* todo */
.card.todo{padding:12px 12px 8px}
.todo-head{display:flex;align-items:center;gap:8px;padding:2px 4px 9px}
.todo-title{flex:1;min-width:0;background:none;border:0;outline:none;font-weight:600;font-size:14px;padding:0}
.todo-title::placeholder,.ti-text::placeholder{color:var(--text-3)}
.todo-count{font-size:11px;color:var(--text-3);font-variant-numeric:tabular-nums}
.todo-bar{height:3px;border-radius:3px;background:var(--hover);margin:0 4px 8px;overflow:hidden}
.todo-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent-strong),var(--accent));border-radius:3px;transition:width .4s var(--ease)}
.ti-row{display:flex;align-items:flex-start;gap:10px;padding:5px 4px;border-radius:8px;transition:background .15s}
.ti-row:hover{background:var(--hover-soft)}
.chk{flex:none;width:18px;height:18px;margin-top:1px;border-radius:6px;border:1.5px solid var(--chk-border);display:grid;place-items:center;color:transparent;transition:all .2s var(--ease)}
.chk:hover{border-color:var(--accent)}
.ti-row.done .chk{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.ti-text{flex:1;min-width:0;background:none;border:0;outline:none;resize:none;padding:0;line-height:1.45;font-size:13.5px;overflow:hidden;display:block;transition:color .2s}
.ti-row.done .ti-text{color:var(--text-3);text-decoration:line-through;text-decoration-color:var(--line-3)}
.todo-add{display:flex;align-items:center;gap:9px;width:100%;padding:7px 6px;margin-top:2px;border-radius:8px;color:var(--text-3);font-size:12.5px}
.todo-add:hover{color:var(--text-2);background:var(--hover-soft)}

/* link */
.card.link{padding:12px}
.lk{display:flex;align-items:center;gap:12px}
.fav{position:relative;width:42px;height:42px;flex:none;border-radius:11px;background:linear-gradient(145deg,var(--surface-3),var(--surface-2));border:1px solid var(--line-2);display:grid;place-items:center;overflow:hidden;font-weight:600;color:var(--text-2)}
.fav img{position:absolute;inset:0;margin:auto;width:22px;height:22px;border-radius:5px;background:var(--surface-2)}
.lk-meta{flex:1;min-width:0}
.lk-title{font-weight:600;font-size:13.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;outline:none;overflow-wrap:anywhere}
.lk-title[contenteditable=true]{display:block;user-select:text;-webkit-user-select:text}
.lk-host{font-size:11.5px;color:var(--text-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lk-open{width:30px;height:30px;flex:none;border-radius:9px;display:grid;place-items:center;color:var(--text-2);background:var(--hover-soft);border:1px solid var(--line);transition:all .15s}
.lk-open:hover{color:var(--accent);border-color:var(--accent-soft)}

/* image */
.card.image{padding:0}
.img-wrap{border-radius:13px;overflow:hidden;background:linear-gradient(110deg,var(--surface-2) 30%,var(--surface-3) 50%,var(--surface-2) 70%);background-size:300% 100%;animation:shimmer 1.6s linear infinite}
.img-wrap img{display:block;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s}
.img-wrap img.ok{opacity:1}
.img-wrap:has(img.ok){animation:none;background:var(--surface-2)}
@keyframes shimmer{to{background-position:-150% 0}}

/* board */
.card.board{width:132px;padding:8px 6px 6px;background:transparent!important;border-color:transparent;box-shadow:none;display:flex;flex-direction:column;align-items:center;text-align:center}
.card.board::before{display:none}
.card.board:hover{border-color:transparent}
.card.board.selected{border-color:transparent;box-shadow:none}
.tile{width:88px;height:88px;border-radius:24px;display:grid;place-items:center;color:var(--tint,var(--accent));background:radial-gradient(120% 120% at 20% 0%,color-mix(in srgb,var(--tint,var(--accent)) 24%,var(--tile-top)) 0%,var(--tile-base) 75%);border:1px solid var(--line-2);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),var(--shadow);transition:transform .3s var(--ease),box-shadow .25s;overflow:hidden}
.card.board:hover .tile{transform:translateY(-2px)}
.card.board.selected .tile{box-shadow:0 0 0 2.5px var(--accent),0 0 0 7px var(--accent-soft),var(--shadow)}
.card.board.drop-into .tile{transform:scale(1.1);box-shadow:0 0 0 2.5px var(--accent),0 0 0 9px var(--accent-soft),0 0 40px -6px var(--accent-glow)}
.tile.mosaic{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:3px;padding:5px;place-items:stretch}
.tile.mosaic img{width:100%;height:100%;min-height:0;object-fit:cover;border-radius:7px;background:var(--surface-3)}
.tile.mosaic[data-n="1"] img{grid-column:1/3;grid-row:1/3;border-radius:19px}
.tile.mosaic[data-n="2"] img{grid-row:1/3}
.tile.mosaic[data-n="3"] img:first-child{grid-row:1/3}
.b-meta{min-width:0;max-width:100%}
.bt{margin-top:10px;font-size:13px;font-weight:550;line-height:1.3;max-width:124px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;outline:none}
.bt[contenteditable=true]{white-space:normal;overflow:visible;user-select:text;-webkit-user-select:text}
.bc{font-size:11px;color:var(--text-3);margin-top:2px}
.card.board>.ch{top:52px}

/* column */
.card.column{padding:10px;background:var(--col-bg)}
.card.column[data-color]{background:color-mix(in srgb,var(--tint) 6%,var(--col-bg))}
.col-head{display:flex;align-items:center;gap:8px;padding:4px 6px 10px}
.col-title{flex:1;min-width:0;font-weight:600;font-size:13px;outline:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.col-title[contenteditable=true]{white-space:normal;user-select:text;-webkit-user-select:text}
.col-count{font-size:11px;color:var(--text-3);background:var(--hover);border-radius:20px;padding:2px 8px;font-variant-numeric:tabular-nums}
.col-body{position:relative;display:flex;flex-direction:column;gap:8px;min-height:60px}
.col-body>.card{position:relative;left:auto;top:auto;width:auto}
.col-body>.card.board{flex-direction:row;align-items:center;gap:12px;padding:8px;text-align:left;background:var(--surface)!important;border-color:var(--line);box-shadow:var(--shadow)}
.col-body>.card.board.selected{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),var(--shadow)}
.col-body .tile{width:44px;height:44px;border-radius:13px}
.col-body .card.board.selected .tile{box-shadow:none}
.col-body .tile>svg{width:20px;height:20px}
.col-body .bt{margin-top:0;max-width:none}
.col-body>.card.board>.ch{top:50%}
.col-empty{border:1.5px dashed var(--line-2);border-radius:11px;display:grid;place-items:center;height:64px;color:var(--text-3);font-size:12px}
.card.column.drop-target{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),var(--shadow)}
.col-ind{position:absolute;left:4px;right:4px;height:3px;border-radius:3px;background:var(--accent);box-shadow:0 0 14px var(--accent-glow);pointer-events:none;z-index:5}

/* frames, locks, guides, labels */
.card.frame{background:color-mix(in srgb,var(--text) 2.5%,transparent);border:1.5px dashed var(--line-3);border-radius:22px;box-shadow:none;pointer-events:none}
.card.frame[data-color]{background:color-mix(in srgb,var(--tint) 7%,transparent);border-color:color-mix(in srgb,var(--tint) 50%,transparent)}
.card.frame::before{display:none}
.card.frame.selected{border-style:solid;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.card.frame.dragging{box-shadow:none}
.card.frame.selected.dragging{box-shadow:0 0 0 3px var(--accent-soft)}
.fr-title{position:absolute;left:-1px;bottom:100%;margin-bottom:8px;display:flex;align-items:center;gap:7px;height:30px;max-width:calc(100% + 2px);padding:0 13px 0 11px;border-radius:10px;background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--shadow);font-size:12.5px;font-weight:600;color:var(--text);pointer-events:auto;cursor:grab;white-space:nowrap;transition:border-color .15s}
.fr-title svg{color:var(--tint,var(--text-3))}
.fr-title span{overflow:hidden;text-overflow:ellipsis;outline:none}
.fr-title span[contenteditable=true]{cursor:text;user-select:text;-webkit-user-select:text}
.card.frame.selected .fr-title{border-color:var(--accent)}
.card.frame>.rz{pointer-events:auto;cursor:nwse-resize;width:15px;height:15px;right:-8px;bottom:-8px}
.card.locked>.rz{display:none}
.lock-badge{position:absolute;top:-10px;right:-10px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line-2);color:var(--text-2);box-shadow:var(--shadow);opacity:0;transition:opacity .15s;z-index:3;pointer-events:none}
.card.locked:hover>.lock-badge,.card.locked.selected>.lock-badge{opacity:1}
.card.tween{transition:left .42s var(--ease),top .42s var(--ease),box-shadow .22s,border-color .2s}
.guide{position:absolute;background:var(--accent);border-radius:1px;box-shadow:0 0 6px var(--accent-glow)}
.link-label{position:absolute;transform:translate(-50%,-50%);padding:3px 11px;border-radius:20px;background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--shadow);font-size:12px;font-weight:500;line-height:1.5;color:var(--text-2);white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis;cursor:pointer;outline:none;min-width:28px;text-align:center;pointer-events:auto;transition:border-color .15s,color .15s}
.link-label.sel{border-color:var(--accent);color:var(--text)}
.link-label[contenteditable=true]{cursor:text;user-select:text;-webkit-user-select:text;overflow:visible;border-color:var(--accent);color:var(--text)}
.link-label:empty::before{content:'Label';color:var(--text-3)}

.tpl-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.tpl{position:relative;text-align:left;border-radius:16px;border:1px solid var(--line);background:var(--hover-soft);padding:8px;transition:border-color .15s,transform .25s var(--ease),box-shadow .2s}
.tpl:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow)}
.tpl-prev{aspect-ratio:16/10;border-radius:10px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.tpl-prev svg{width:100%;height:100%;display:block}
.tpl-meta{display:flex;gap:9px;align-items:flex-start;padding:10px 4px 4px}
.tpl-ic{font-size:18px;line-height:1.15}
.tpl-meta b{display:block;font-size:13px;color:var(--text);font-weight:600}
.tpl-meta span span{display:block;font-size:11.5px;color:var(--text-3);line-height:1.4;margin-top:1px}
.tpl-del{position:absolute;top:13px;right:13px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--glass);color:var(--text-2);opacity:0;transition:opacity .15s;box-shadow:var(--shadow)}
.tpl:hover .tpl-del{opacity:1}
.tpl-h{margin:20px 0 4px;font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--text-3)}
@media (max-width:760px){.tpl-grid{grid-template-columns:repeat(2,1fr)}.emoji-grid{grid-template-columns:repeat(8,1fr)}.bc-wrap{flex-direction:column}.gal-stage{padding:0 10px}.gal-nav{display:none}}

/* phase 6 */
.menu{max-height:calc(100vh - 24px);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
#tl{max-width:calc(100vw - 760px)}
@media (max-width:1180px){#tl{max-width:calc(100vw - 640px)}}
.mi .k.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;display:inline-grid;place-items:center;font-size:11px;font-weight:600;color:var(--accent-strong);background:var(--accent-soft)}
.mi .k.badge.over{color:var(--danger);background:var(--danger-soft)}

/* due dates */
.ti-due{flex:none;align-self:flex-start;margin-top:0;height:21px;padding:0 7px 0 6px;border-radius:7px;font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:4px;color:var(--text-2);background:var(--hover);white-space:nowrap;font-variant-numeric:tabular-nums;transition:background .15s,color .15s,filter .15s}
.ti-due:hover{filter:brightness(.97);box-shadow:inset 0 0 0 1px var(--line-2)}
.ti-due.soon{color:var(--warn);background:var(--warn-soft)}
.ti-due.today{color:var(--accent-strong);background:var(--accent-soft)}
.ti-due.over{color:var(--danger);background:var(--danger-soft)}
.ti-row.done .ti-due{color:var(--text-3);background:transparent;text-decoration:line-through}
.ti-cal{flex:none;width:22px;height:21px;border-radius:7px;display:grid;place-items:center;color:var(--text-3);opacity:0;transition:opacity .15s,background .15s,color .15s}
.ti-row:hover .ti-cal,.ti-row:focus-within .ti-cal,.ti-cal.open{opacity:1}
.ti-cal:hover,.ti-cal.open{background:var(--hover);color:var(--text)}
.ti-row.done .ti-cal{display:none}
.todo-count.has-over{color:var(--danger);font-weight:600}
.todo-count.has-over::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--danger);margin-right:5px;vertical-align:1px}
#duepop{position:fixed;z-index:210;width:272px;padding:12px;border-radius:18px;background:var(--menu-bg);opacity:0;transform:translateY(-4px) scale(.98);transform-origin:top left;transition:opacity .16s var(--ease),transform .2s var(--ease);pointer-events:none}
#duepop.show{opacity:1;transform:none;pointer-events:auto}
.dp-quick{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:12px}
.dp-quick button{height:30px;border-radius:9px;font-size:12px;font-weight:500;color:var(--text-2);background:var(--hover-soft);border:1px solid var(--line);transition:all .15s}
.dp-quick button:hover{color:var(--text);background:var(--hover);border-color:var(--line-2)}
.dp-head{display:flex;align-items:center;justify-content:space-between;padding:0 2px 8px}
.dp-head b{font-family:var(--serif);font-weight:400;font-size:20px;letter-spacing:-.01em}
.dp-head .ib{width:28px;height:28px}
.dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.dp-grid .wd{font-size:10px;font-weight:600;letter-spacing:.06em;color:var(--text-3);padding:2px 0 6px;text-transform:uppercase}
.dp-grid button{height:32px;border-radius:9px;font-size:12.5px;color:var(--text);font-variant-numeric:tabular-nums;transition:background .12s,color .12s;position:relative}
.dp-grid button:hover{background:var(--hover)}
.dp-grid button.out{color:var(--text-3)}
.dp-grid button.past{color:var(--text-3)}
.dp-grid button.today{color:var(--accent-strong);font-weight:700}
.dp-grid button.today::after{content:'';position:absolute;left:50%;bottom:4px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:currentColor}
.dp-grid button.on{background:linear-gradient(180deg,var(--primary-a),var(--primary-b));color:var(--on-accent);font-weight:600;box-shadow:0 6px 16px -8px var(--accent-glow)}
.dp-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.dp-foot span{font-size:12px;color:var(--text-3)}
.dp-foot button{font-size:12px;font-weight:600;color:var(--danger);padding:6px 10px;border-radius:8px}
.dp-foot button:hover{background:var(--danger-soft)}
#dueBtn{position:relative}
#dueBtn .badge{position:absolute;top:3px;right:2px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;font-size:10px;font-weight:700;line-height:16px;text-align:center;background:var(--accent);color:var(--on-accent);box-shadow:0 0 0 2px var(--surface)}
#dueBtn.over .badge{background:var(--danger);color:#fff}
.modal.due-modal{width:min(560px,100%)}
.due-list{display:flex;flex-direction:column;gap:2px;margin:4px -8px 0;max-height:min(56vh,480px);overflow:auto;padding:0 2px}
.due-group{padding:12px 8px 5px;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);display:flex;gap:8px;align-items:center}
.due-group.over{color:var(--danger)}
.due-group i{font-style:normal;color:var(--text-3);font-weight:500;letter-spacing:0}
.due-row{display:flex;align-items:center;gap:12px;padding:9px 8px;border-radius:12px;cursor:pointer;transition:background .15s,opacity .3s,transform .3s var(--ease)}
.due-row:hover{background:var(--hover)}
.due-row.gone{opacity:0;transform:translateX(12px)}
.due-row .chk{margin:0}
.due-row.done .chk{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.dr-main{flex:1;min-width:0}
.dr-t{color:var(--text);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dr-t.empty{color:var(--text-3);font-style:italic}
.dr-s{font-size:11.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.due-empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:26px 10px 14px;color:var(--text-3)}
.due-empty .em-ic{width:54px;height:54px;border-radius:17px;display:grid;place-items:center;color:var(--accent);background:var(--accent-soft)}

/* kanban */
.col-add{display:flex;align-items:center;gap:8px;width:100%;margin-top:8px;padding:9px 10px;border-radius:11px;color:var(--text-3);font-size:12.5px;font-weight:500;transition:background .15s,color .15s}
.col-add:hover{color:var(--text);background:color-mix(in srgb,var(--surface) 70%,transparent)}
.card.column[data-color] .col-add:hover svg{color:var(--tint)}
#canvas.kanban .card.column{box-shadow:var(--shadow)}
#canvas.kanban .card.column>.col-head .col-title{font-weight:600}

/* focus mode */
#tl,#tr,#dock,#minimap{transition:opacity .35s var(--ease),visibility .35s}
body.focus-mode #tl,body.focus-mode #tr,body.focus-mode #dock,body.focus-mode #minimap,body.focus-mode #filterbar,
body.presenting #tl,body.presenting #tr,body.presenting #dock,body.presenting #minimap,body.presenting #filterbar,body.presenting #empty{opacity:0;visibility:hidden;pointer-events:none}
body.focus-mode #canvas::after{background:radial-gradient(110% 85% at 50% 45%,transparent 45%,var(--vignette))}
#world.has-focus>.card:not(.selected):not(.focus-anc):not(:focus-within){opacity:.12;filter:grayscale(.6) blur(.6px)}
#world.has-focus>#links,#world.has-focus>#labels{opacity:.15;transition:opacity .3s}
#focuspill{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));z-index:70;display:flex;align-items:center;gap:10px;height:38px;padding:0 6px 0 14px;border-radius:13px;font-size:12.5px;color:var(--text-2);transform:translate(-50%,-8px);opacity:0;pointer-events:none;transition:opacity .35s var(--ease),transform .35s var(--ease)}
body.focus-mode #focuspill{opacity:.55;transform:translate(-50%,0);pointer-events:auto}
body.focus-mode #focuspill:hover{opacity:1}
#focuspill .dotf{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
#focuspill button{height:28px;padding:0 11px;border-radius:9px;font-weight:600;color:var(--text);background:var(--hover)}
#focuspill button:hover{background:var(--line-2)}

/* presentation */
body.presenting #canvas{cursor:default}
body.presenting .card .ch,body.presenting .card .rz,body.presenting .fr-title,body.presenting .lock-badge,body.presenting .sk-hint,body.presenting .col-add{display:none!important}
body.presenting .card.frame{border-color:transparent;background:transparent}
body.presenting .card.pres-dim{opacity:.08;filter:grayscale(.8)}
body.presenting #links{transition:opacity .4s}
#presbar{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));z-index:80;display:flex;align-items:center;gap:4px;height:50px;padding:0 6px;border-radius:17px;transform:translate(-50%,10px);opacity:0;pointer-events:none;transition:opacity .35s var(--ease),transform .35s var(--ease)}
body.presenting #presbar{opacity:1;transform:translate(-50%,0);pointer-events:auto}
body.presenting.pres-idle #presbar{opacity:0;transform:translate(-50%,6px)}
body.presenting.pres-idle,body.presenting.pres-idle #canvas{cursor:none}
#presbar .pb-mid{display:flex;flex-direction:column;align-items:center;min-width:150px;max-width:300px;padding:0 12px;line-height:1.2}
#presbar .pb-t{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
#presbar .pb-n{font-size:11px;color:var(--text-3);font-variant-numeric:tabular-nums;margin-top:2px}
#presbar .ib:disabled{opacity:.3;pointer-events:none}
#presprog{position:fixed;left:0;top:0;height:3px;z-index:81;background:linear-gradient(90deg,var(--primary-a),var(--primary-b));width:0;opacity:0;transition:width .5s var(--ease),opacity .3s;box-shadow:0 0 12px var(--accent-glow)}
body.presenting #presprog{opacity:1}

/* export dialog */
.modal.xp-modal{width:min(640px,100%)}
.xp-tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:6px 0 18px}
.xp-tab{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px 12px;border-radius:15px;border:1px solid var(--line-2);background:var(--hover-soft);color:var(--text-2);font-size:12px;font-weight:600;transition:all .18s var(--ease)}
.xp-tab:hover{color:var(--text);border-color:var(--line-3);transform:translateY(-1px)}
.xp-tab .xi{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow);color:var(--text-2);transition:all .18s}
.xp-tab.on{color:var(--text);border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px var(--accent-soft)}
.xp-tab.on .xi{color:var(--on-accent);background:linear-gradient(180deg,var(--primary-a),var(--primary-b));box-shadow:0 8px 18px -8px var(--accent-glow)}
.xp-tab small{display:block;font-size:10.5px;font-weight:500;color:var(--text-3);margin-top:-4px}
.xp-opts{display:flex;flex-direction:column;gap:12px;min-height:150px}
.xp-row{display:flex;align-items:center;gap:14px}
.xp-row>span{width:96px;flex:none;font-size:12.5px;font-weight:500;color:var(--text-2)}
.xp-row .seg{flex:1}
.seg button:disabled{opacity:.35;pointer-events:none}
.xp-note{font-size:12.5px;color:var(--text-3);line-height:1.55;margin:2px 0 0}
.xp-note b{color:var(--text-2);font-weight:600}
.xp-md{width:100%;height:200px;resize:vertical;border-radius:13px;background:var(--input-bg);border:1px solid var(--line-2);padding:12px 14px;font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--text-2);outline:none}
.xp-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.xp-stats div{padding:12px 14px;border-radius:13px;background:var(--hover-soft);border:1px solid var(--line)}
.xp-stats b{display:block;font-family:var(--serif);font-weight:400;font-size:26px;color:var(--text);line-height:1}
.xp-stats span{font-size:11.5px;color:var(--text-3)}
.btn.busy{pointer-events:none;opacity:.8}
.btn .spin{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:760px){.xp-tabs{gap:5px}.xp-tab{padding:10px 2px 9px;font-size:10.5px;gap:6px;border-radius:13px}.xp-tab .xi{width:32px;height:32px;border-radius:10px}.xp-tab small{display:none}.xp-row{flex-direction:column;align-items:stretch;gap:6px}.xp-row>span{width:auto}.xp-stats b{font-size:22px}}

/* print */
#printSheet{display:none}
@media print{
  @page{margin:10mm}
  html,body{height:auto!important;overflow:visible!important;background:#fff!important}
  #tl,#tr,#dock,#minimap,#morepop,#drawbar,#toasts,#filterbar,#ctx,#fmt,#duepop,#presbar,#presprog,#focuspill,#empty,.overlay{display:none!important}
  #canvas::after{display:none}
  body.print-sheet>*:not(#printSheet){display:none!important}
  body.print-sheet #printSheet{display:block}
  .ps-page{break-after:page;page-break-after:always;display:flex;align-items:center;justify-content:center;height:calc(100vh - 1px);overflow:hidden}
  .ps-page:last-child{break-after:auto;page-break-after:auto}
  .ps-page img{max-width:100%;max-height:100%;object-fit:contain;display:block}
}

#dueBtn[hidden]{display:none!important}
/* phase 7 — shades */
:root[data-theme=dark][data-shade=graphite]{
  --bg:#1b1b1e;--surface:#252528;--surface-2:#2b2b2f;--surface-3:#353539;
  --line:rgba(255,255,255,.07);--line-2:rgba(255,255,255,.12);--line-3:rgba(255,255,255,.22);
  --glass:rgba(40,40,44,.78);--menu-bg:rgba(42,42,47,.95);--menu-solid:#2a2a2e;--modal-bg:rgba(37,37,41,.97);--overlay-bg:rgba(10,10,12,.5);
  --input-bg:rgba(0,0,0,.22);--dots:rgba(255,255,255,.09);--vignette:rgba(0,0,0,.3);
  --col-bg:#1f1f22;--tile-top:#2e2e33;--tile-base:#222226;--gridline:rgba(255,255,255,.05);
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 1px 2px rgba(0,0,0,.35),0 10px 28px -12px rgba(0,0,0,.6);
}
:root[data-theme=dark][data-shade=midnight]{
  --bg:#0a0f1e;--surface:#121a2e;--surface-2:#172038;--surface-3:#202a46;
  --line:rgba(170,190,255,.08);--line-2:rgba(170,190,255,.13);--line-3:rgba(170,190,255,.24);
  --text:#e8ecf7;--text-2:#a2abc4;--text-3:#68728f;
  --glass:rgba(16,23,42,.78);--menu-bg:rgba(19,27,48,.95);--menu-solid:#141c33;--modal-bg:rgba(17,24,44,.97);--overlay-bg:rgba(3,6,16,.6);
  --input-bg:rgba(0,0,0,.3);--dots:rgba(170,190,255,.09);--vignette:rgba(0,2,12,.55);
  --col-bg:#0d1325;--tile-top:#1a2340;--tile-base:#10172c;--gridline:rgba(170,190,255,.05);--chk-border:rgba(170,190,255,.25);
  --shadow:0 1px 0 rgba(170,190,255,.04) inset,0 1px 2px rgba(0,0,10,.45),0 10px 30px -12px rgba(0,0,12,.75);
}
:root[data-theme=dark][data-shade=oled]{
  --bg:#000;--surface:#0b0b0c;--surface-2:#111113;--surface-3:#19191c;
  --line:rgba(255,255,255,.08);--line-2:rgba(255,255,255,.13);
  --glass:rgba(10,10,11,.84);--menu-bg:rgba(12,12,13,.96);--menu-solid:#0c0c0d;--modal-bg:rgba(9,9,10,.98);--overlay-bg:rgba(0,0,0,.7);
  --input-bg:#000;--dots:rgba(255,255,255,.075);--vignette:transparent;
  --col-bg:#050506;--tile-top:#141416;--tile-base:#0a0a0b;--gridline:rgba(255,255,255,.045);
  --shadow:0 0 0 1px rgba(255,255,255,.035),0 10px 30px -14px rgba(0,0,0,.9);
}
/* accents */
:root[data-accent=sky]{--accent:#2f7fd6;--accent-strong:#2069bd;--accent-soft:rgba(47,127,214,.12);--accent-glow:rgba(47,127,214,.35);--primary-a:#5a9ef0;--primary-b:#2f7fd6;--sel-text:rgba(47,127,214,.22)}
:root[data-accent=mint]{--accent:#1b9a6e;--accent-strong:#14825c;--accent-soft:rgba(27,154,110,.12);--accent-glow:rgba(27,154,110,.32);--primary-a:#38bd8c;--primary-b:#1b9a6e;--sel-text:rgba(27,154,110,.2)}
:root[data-accent=rose]{--accent:#d9466f;--accent-strong:#c2355d;--accent-soft:rgba(217,70,111,.11);--accent-glow:rgba(217,70,111,.32);--primary-a:#ec6b8f;--primary-b:#d9466f;--sel-text:rgba(217,70,111,.2)}
:root[data-accent=amber]{--accent:#d6721c;--accent-strong:#bb6114;--accent-soft:rgba(214,114,28,.12);--accent-glow:rgba(214,114,28,.32);--primary-a:#ef934a;--primary-b:#d6721c;--sel-text:rgba(214,114,28,.2)}
:root[data-accent=mono]{--accent:#2b2925;--accent-strong:#141310;--accent-soft:rgba(30,26,18,.08);--accent-glow:rgba(30,26,18,.25);--primary-a:#4b4842;--primary-b:#22201c;--on-accent:#fff;--sel-text:rgba(30,26,18,.14)}
:root[data-theme=dark][data-accent=sky]{--accent:#7cbcff;--accent-strong:#5aa6fa;--accent-soft:rgba(124,188,255,.14);--accent-glow:rgba(124,188,255,.42);--primary-a:#a2d0ff;--primary-b:#6cb2ff;--on-accent:#06131f;--sel-text:rgba(124,188,255,.3)}
:root[data-theme=dark][data-accent=mint]{--accent:#62d6a9;--accent-strong:#44c795;--accent-soft:rgba(98,214,169,.14);--accent-glow:rgba(98,214,169,.4);--primary-a:#8ae6c2;--primary-b:#4fcf9d;--on-accent:#04170f;--sel-text:rgba(98,214,169,.28)}
:root[data-theme=dark][data-accent=rose]{--accent:#ff8aa8;--accent-strong:#ff6f93;--accent-soft:rgba(255,138,168,.14);--accent-glow:rgba(255,138,168,.42);--primary-a:#ffadc2;--primary-b:#ff7c9e;--on-accent:#1f0710;--sel-text:rgba(255,138,168,.3)}

/* appearance panel */
.modal.look-modal{width:min(620px,100%)}
.lk-h{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);margin:4px 0 10px}
.lk-themes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px}
.lk-theme{display:flex;flex-direction:column;gap:8px;padding:6px 6px 10px;border-radius:16px;border:1px solid var(--line-2);background:var(--hover-soft);font-size:12.5px;font-weight:600;color:var(--text-2);transition:all .18s var(--ease);text-align:left}
.lk-theme:hover{border-color:var(--line-3);color:var(--text);transform:translateY(-1px)}
.lk-theme.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);color:var(--text)}
.lk-theme>span{padding:0 6px;display:flex;align-items:center;justify-content:space-between}
.lk-theme .ck{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);opacity:0;transform:scale(.6);transition:all .2s var(--ease)}
.lk-theme.on .ck{opacity:1;transform:none}

.dk-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px}

/* tour */

.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft);flex:none}
.dot.warn{background:var(--warn);box-shadow:0 0 0 3px var(--warn-soft)}
.dot.bad{background:var(--danger);box-shadow:0 0 0 3px var(--danger-soft)}
.search-pill{display:flex;align-items:center;gap:8px;height:32px;padding:0 6px 0 10px;border-radius:10px;color:var(--text-2);font-size:12.5px;font-weight:500;background:var(--hover-soft);border:1px solid var(--line);margin-right:4px;transition:background .15s,color .15s}
.search-pill:hover{background:var(--hover);color:var(--text)}
.search-pill kbd{font-size:10.5px;padding:2px 6px}
#themeBtn svg{transition:transform .5s var(--ease)}
#themeBtn:hover svg{transform:rotate(-20deg)}

#dock{position:fixed;left:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:2px;padding:7px;border-radius:20px;z-index:50;touch-action:none}
.tool{width:60px;padding:9px 0 7px;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10.5px;font-weight:500;color:var(--text-2);user-select:none;-webkit-user-select:none;transition:color .15s,background .15s}
.tool .tic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);color:var(--text);transition:transform .25s var(--ease),background .2s,color .2s,border-color .2s}
.tool:hover{color:var(--text);background:var(--hover-soft)}
.tool:hover .tic{transform:translateY(-1px);color:var(--accent);border-color:var(--accent-soft);background:var(--surface)}
.tool:active .tic{transform:scale(.94)}
.ghost{position:fixed;left:0;top:0;z-index:400;display:flex;gap:9px;align-items:center;padding:10px 15px;border-radius:13px;font-size:13px;font-weight:500;pointer-events:none;margin:-22px 0 0 -20px;color:var(--text)}
.ghost svg{color:var(--accent)}

/* menus */
.menu{position:fixed;z-index:200;min-width:236px;max-width:320px;padding:6px;border-radius:15px;opacity:0;transform:scale(.97) translateY(-4px);transition:opacity .16s var(--ease),transform .2s var(--ease);pointer-events:none;background:var(--menu-bg)}
.menu.show{opacity:1;transform:none;pointer-events:auto}
.mi{display:flex;align-items:center;gap:10px;width:100%;height:34px;padding:0 10px;border-radius:9px;font-size:13px;color:var(--text);text-align:left;transition:background .12s}
.mi>span:first-of-type{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi svg{color:var(--text-2)}
.mi:hover{background:var(--hover)}
.mi:hover svg{color:var(--text)}
.mi.danger,.mi.danger svg{color:var(--danger)}
.mi .k{color:var(--text-3);font-size:11.5px;white-space:nowrap}
.msep{height:1px;background:var(--line-2);margin:5px 4px}
.mlabel{padding:8px 10px 3px;font-size:10.5px;color:var(--text-3);font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.mnote{padding:4px 10px 8px;font-size:12px;color:var(--text-3)}
.swatches{display:flex;gap:8px;padding:8px 10px 7px}
.sw{width:20px;height:20px;border-radius:50%;background:var(--tint);border:1.5px solid var(--line-2);position:relative;transition:transform .18s var(--ease)}
.sw:hover{transform:scale(1.15)}
.sw.none{background:var(--surface-3);overflow:hidden}
.sw.none::after{content:'';position:absolute;left:50%;top:-2px;bottom:-2px;width:1.5px;background:var(--text-3);transform:rotate(45deg)}
.sw.on{box-shadow:0 0 0 2px var(--menu-solid),0 0 0 3.5px var(--text)}

#fmt{position:fixed;z-index:120;display:flex;align-items:center;gap:2px;padding:4px;border-radius:12px;opacity:0;pointer-events:none;transform:translateY(4px);transition:opacity .15s,transform .2s var(--ease)}
#fmt.show{opacity:1;pointer-events:auto;transform:none}
#fmt button{width:30px;height:30px;border-radius:8px;font-size:13.5px;color:var(--text-2);display:grid;place-items:center;transition:background .12s,color .12s}
#fmt button:hover{background:var(--hover);color:var(--text)}
#fmt button.on{color:var(--accent);background:var(--accent-soft)}
#fmt .fsep{width:1px;height:18px;background:var(--line-2);margin:0 3px}

#marquee{position:fixed;display:none;border:1px solid var(--accent);background:var(--accent-soft);border-radius:5px;z-index:30;pointer-events:none}

#empty{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;z-index:4;opacity:0;transition:opacity .45s;width:min(360px,80vw)}
#empty.show{opacity:1}
.em-ic{width:68px;height:68px;margin:0 auto 20px;border-radius:22px;display:grid;place-items:center;color:var(--accent);background:radial-gradient(120% 120% at 20% 0%,color-mix(in srgb,var(--accent) 22%,var(--tile-top)),var(--tile-base) 75%);border:1px solid var(--line-2);box-shadow:var(--shadow)}
#empty h3{font-family:var(--serif);font-weight:400;font-size:30px;margin:0 0 8px;letter-spacing:-.005em}
#empty p{color:var(--text-3);font-size:13px;margin:0;line-height:1.65}

/* modal */
.overlay{position:fixed;inset:0;z-index:300;display:grid;place-items:center;padding:20px;background:var(--overlay-bg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);opacity:0;transition:opacity .22s}
.overlay.show{opacity:1}
.modal{width:min(470px,100%);border-radius:24px;padding:28px 28px 22px;transform:translateY(12px) scale(.98);transition:transform .38s var(--ease);background:var(--modal-bg);max-height:calc(100vh - 40px);overflow:auto}
.modal.wide{width:min(540px,100%)}
.overlay.show .modal{transform:none}
.modal h2{font-family:var(--serif);font-weight:400;font-size:31px;line-height:1.08;margin:0 0 12px;letter-spacing:-.01em}
.eyebrow{font-size:10.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--accent);font-weight:600;margin-bottom:12px}
.m-body{color:var(--text-2);font-size:13.5px;line-height:1.6}
.m-body p{margin:0 0 12px}.m-body b{color:var(--text);font-weight:600}
.m-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px;flex-wrap:wrap}
.m-actions .left{margin-right:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;padding:0 18px;border-radius:12px;font-size:13px;font-weight:600;color:var(--text);background:var(--hover);border:1px solid var(--line-2);transition:all .15s;white-space:nowrap}
.btn:hover{background:var(--hover);border-color:var(--line-3)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.sm{height:32px;padding:0 12px;font-size:12.5px;border-radius:10px}
.btn.primary{background:linear-gradient(180deg,var(--primary-a),var(--primary-b));color:var(--on-accent);border-color:transparent;box-shadow:0 10px 26px -10px var(--accent-glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{background:var(--danger-soft);color:var(--danger);border-color:color-mix(in srgb,var(--danger) 30%,transparent)}
.facts{list-style:none;margin:16px 0 6px;padding:0;display:grid;gap:9px}
.facts li{display:flex;gap:13px;align-items:flex-start;padding:13px 15px;border-radius:14px;background:var(--hover-soft);border:1px solid var(--line)}
.facts li svg{color:var(--accent);margin-top:2px}
.facts b{display:block;margin-bottom:2px}
.stat{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px;padding:6px 2px;border-top:1px solid var(--line);font-size:13px}
.stat b{font-weight:550;color:var(--text)}
.stat .r{display:flex;align-items:center;gap:10px}
.warnbox{padding:12px 14px;border-radius:13px;background:var(--danger-soft);border:1px solid color-mix(in srgb,var(--danger) 25%,transparent);color:var(--danger);margin-bottom:12px}
.field{display:block;margin-top:14px}
.field input{width:100%;height:46px;border-radius:13px;background:var(--input-bg);border:1px solid var(--line-2);padding:0 15px;outline:none;font-size:14px;transition:border-color .15s,box-shadow .15s}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.shake{animation:shake .38s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.kbd-grid{display:grid;grid-template-columns:1fr auto;gap:9px 18px;font-size:13px;align-items:center}
.kbd-grid span:nth-child(odd){color:var(--text-2)}
kbd{font-family:var(--font);font-size:11.5px;padding:3px 7px;border-radius:6px;background:var(--hover);border:1px solid var(--line-2);color:var(--text);white-space:nowrap}
.lb img{max-width:92vw;max-height:86vh;border-radius:16px;box-shadow:var(--shadow-lift);transform:scale(.96);transition:transform .35s var(--ease)}
.overlay.show.lb img{transform:none}
.lb-x{position:fixed;top:16px;right:16px;background:var(--glass)}
.meter{height:8px;border-radius:8px;background:var(--hover);overflow:hidden;margin:16px 0 8px}
.meter i{display:block;height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,var(--accent-strong),var(--accent));transition:width .8s var(--ease)}
.meter-l{display:flex;justify-content:space-between;font-size:12px;color:var(--text-3);margin-bottom:10px}
.sec{margin-top:16px;padding:15px 16px;border-radius:16px;border:1px solid var(--line);background:var(--hover-soft)}
.sec h4{margin:0 0 6px;font-size:13.5px;color:var(--text);font-weight:600;display:flex;align-items:center;gap:8px}
.sec h4 svg{color:var(--accent)}
.sec p{margin:0 0 12px;font-size:12.5px}
.sec .row{display:flex;gap:8px;flex-wrap:wrap}
.badge{font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--hover);color:var(--text-2);margin-left:auto}
.badge.ok{background:var(--ok-soft);color:var(--ok)}.badge.warn{background:var(--warn-soft);color:var(--warn)}
details.more{margin-top:14px}
details.more summary{cursor:pointer;color:var(--text-2);font-size:12.5px;font-weight:500;list-style:none;display:flex;align-items:center;gap:6px}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:'›';display:inline-block;transition:transform .2s;font-size:15px}
details.more[open] summary::before{transform:rotate(90deg)}
.tlist{display:flex;flex-direction:column;gap:6px;margin-top:4px;max-height:min(52vh,420px);overflow:auto;padding:2px}
.trow{display:flex;align-items:center;gap:12px;padding:9px 8px 9px 10px;border-radius:14px;background:var(--hover-soft);border:1px solid var(--line);transition:opacity .25s,transform .25s var(--ease)}
.t-ic{width:40px;height:40px;flex:none;border-radius:11px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--text-2);overflow:hidden}
.t-ic img{width:100%;height:100%;object-fit:cover}
.t-txt{flex:1;min-width:0}
.t-title{font-size:13.5px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-more{color:var(--text-3);font-weight:500}
.t-meta{font-size:11.5px;color:var(--text-3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-empty{display:grid;place-items:center;gap:10px;padding:38px 0 30px;color:var(--text-3)}
.t-empty svg{width:28px;height:28px}

/* palette */
.overlay.pal{place-items:start center;padding-top:min(14vh,120px)}
.palette{width:min(640px,100%);border-radius:20px;overflow:hidden;background:var(--modal-bg);transform:translateY(-8px) scale(.985);transition:transform .3s var(--ease)}
.overlay.show .palette{transform:none}
.pal-in{display:flex;align-items:center;gap:12px;padding:0 16px 0 18px;height:60px;border-bottom:1px solid var(--line);color:var(--text-3)}
.pal-in input{flex:1;min-width:0;border:0;outline:none;background:none;font-size:16px;height:100%;color:var(--text)}
.pal-in input::placeholder{color:var(--text-3)}
.pal-list{max-height:min(56vh,460px);overflow:auto;padding:6px}
.pal-label{padding:10px 12px 6px;font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3)}
.pal-row{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:12px;cursor:pointer}
.pal-row.on{background:var(--hover)}
.pal-ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);color:var(--text-2);flex:none;transition:color .15s}
.pal-row.on .pal-ic{color:var(--accent)}
.pal-txt{flex:1;min-width:0}
.pal-t{font-size:13.5px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pal-s{font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.pal-row .k{color:var(--text-3);font-size:11.5px;white-space:nowrap}
.pal-empty{padding:38px 20px;text-align:center;color:var(--text-3)}
.pal-foot{display:flex;gap:18px;padding:10px 18px;border-top:1px solid var(--line);font-size:11.5px;color:var(--text-3)}
.pal-foot kbd{font-size:10.5px;padding:1px 5px}
mark{background:var(--accent-soft);color:var(--text);border-radius:3px;padding:0 1px}

/* toast */
#toasts{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;z-index:350;pointer-events:none}
.toast{display:flex;align-items:center;gap:12px;padding:11px 16px;border-radius:13px;font-size:13px;opacity:0;transform:translateY(10px) scale(.98);transition:all .3s var(--ease);pointer-events:auto;white-space:nowrap;max-width:calc(100vw - 32px)}
.toast span{overflow:hidden;text-overflow:ellipsis}
.toast.has-act{padding-right:8px}
.toast.show{opacity:1;transform:none}
.toast button{color:var(--accent);font-weight:600;padding:6px 10px;border-radius:8px;flex:none}
.toast button:hover{background:var(--accent-soft)}

@media (max-width:1180px){ .search-pill span,.search-pill kbd,.chip span{display:none} .search-pill{padding:0 9px} #tl{max-width:calc(100vw - 520px)} }
@media (max-width:760px){
  #dock{left:50%;top:auto;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);flex-direction:row;padding:6px;border-radius:19px}
  .tool{width:50px;padding:7px 0 5px;font-size:9.5px;gap:4px}
  .tool .tic{width:30px;height:30px}
  .brand-name,.brand .chev,.hide-sm{display:none!important}
  .search-pill{background:none;border:0;margin:0;padding:0;width:34px;justify-content:center}
  .desk-only{display:none!important}
  #tr .chip,#tr .chip+.vsep{display:none}
  #tl{max-width:calc(100vw - 252px)}
  #morepop .mob-only{display:flex!important}
  #morepop{left:50%!important;top:auto!important;bottom:calc(84px + env(safe-area-inset-bottom));width:min(360px,calc(100vw - 24px));transform:translate(-50%,8px) scale(.98);transform-origin:bottom center}
  #morepop.show{transform:translate(-50%,0)}
  .cp{flex-direction:column}.cp-prev{width:100%;min-height:96px}
  #tl{max-width:calc(100vw - 226px)}
  #toasts{bottom:calc(96px + env(safe-area-inset-bottom))}
  .chip{padding:0 10px}
  .modal{padding:24px 20px 18px}
}
@media (hover:none){
  .card:hover>.ch{opacity:0}.card.selected>.ch{opacity:1}
  .ch{width:22px;height:22px;margin-top:-11px;right:-12px}.ch::after{inset:5px}
  .rz{width:18px;height:18px;right:-8px;bottom:-8px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="canvas"><div id="stage"><div id="world"></div></div></div>

<div id="tl" class="bar glass">
  <button class="brand" id="brand" title="Pinned & recent boards">
    <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="bm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b9adff"/><stop offset="1" stop-color="#6450ea"/></linearGradient></defs><rect x="2" y="2" width="9" height="12" rx="2.6" fill="url(#bm)"/><rect x="13" y="2" width="9" height="7" rx="2.6" fill="url(#bm)" opacity=".55"/><rect x="2" y="16" width="9" height="6" rx="2.6" fill="url(#bm)" opacity=".35"/><rect x="13" y="11" width="9" height="11" rx="2.6" fill="url(#bm)" opacity=".8"/></svg>
    <span class="brand-name">Tessera</span>
    <span class="chev" data-ico="chevd" data-s="14"></span>
  </button>
  <div class="vsep"></div>
  <nav id="crumbs" aria-label="Boards"></nav>
  <button class="ib pin" id="pinBtn" title="Pin this board"></button>
</div>

<div id="tr" class="bar glass">
  <button class="ib hide-sm" id="dueBtn" hidden title="Due soon"><i data-ico="calendar"></i><b class="badge"></b></button>
  <button class="search-pill" id="searchBtn" title="Search everything (Ctrl K)"><i data-ico="search" data-s="16"></i><span>Search</span><kbd>Ctrl K</kbd></button>
  <button class="chip" id="chip" title="Storage & backup"><i class="dot" id="dot"></i><span id="chipText">On this device</span></button>
  <div class="vsep"></div>
  <button class="ib" id="undoBtn" title="Undo (Ctrl Z)" data-ico="undo"></button>
  <button class="ib" id="redoBtn" title="Redo (Ctrl Shift Z)" data-ico="redo"></button>
  <div class="vsep hide-sm"></div>
  <button class="ib hide-sm" id="zoomOut" title="Zoom out (Ctrl −)" data-ico="minus"></button>
  <button class="zl hide-sm" id="zl" title="Reset to 100%">100%</button>
  <button class="ib hide-sm" id="zoomIn" title="Zoom in (Ctrl +)" data-ico="plus"></button>
  <button class="ib hide-sm" id="fitBtn" title="Fit to screen (Ctrl 0)" data-ico="fit"></button>
  <button class="ib hide-sm" id="presBtn" title="Present (P)" data-ico="present"></button>
  <div class="vsep"></div>
  <button class="ib hide-sm" id="helpBtn" title="How to use Tessera (?)" data-ico="help"></button>
  <button class="ib" id="themeBtn" title="Switch theme"></button>
  <button class="ib" id="moreBtn" title="Menu" data-ico="more"></button>
</div>

<nav id="dock" class="glass" aria-label="Add cards"></nav>
<div id="minimap" class="glass" title="Click or drag to move around"><canvas></canvas></div>
<div id="morepop" class="glass" aria-label="More card types"></div>
<div id="drawbar" class="glass" aria-label="Drawing tools"></div>

<div id="empty"><div class="em-ic" data-ico="board" data-s="28"></div><h3>A blank board</h3><p>Drag a card from the dock, double-click anywhere to write, or drop images straight onto the canvas.</p><button class="btn primary em-btn" id="emTpl">Start from a template</button></div>
<div id="filterbar" class="glass" aria-live="polite"></div>
<div id="marquee"></div>
<div id="ctx" class="menu glass" role="menu"></div>
<div id="fmt" class="glass">
  <button data-cmd="bold" title="Bold (Ctrl B)"><b>B</b></button>
  <button data-cmd="italic" title="Italic (Ctrl I)"><i style="font-family:var(--serif);font-size:17px">I</i></button>
  <button data-cmd="underline" title="Underline (Ctrl U)"><u>U</u></button>
  <button data-cmd="strikeThrough" title="Strikethrough"><s>S</s></button>
  <span class="fsep"></span>
  <button data-cmd="heading" title="Heading" style="font-family:var(--serif);font-size:18px">H</button>
  <button data-cmd="insertUnorderedList" title="Bulleted list" data-ico="list" data-s="16"></button>
</div>
<div id="toasts"></div>

<script>
(() => {
'use strict';

/* ================= Utilities ================= */
const $ = (s, r = document) => r.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const NS = 'http://www.w3.org/2000/svg';
const DAY = 864e5, TRASH_DAYS = 30;

const STAR = 'm12 3.2 2.7 5.5 6 .9-4.35 4.25 1 6L12 17l-5.35 2.85 1-6L3.3 9.6l6-.9z';
const ICONS = {
  note:'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="M8 13h8M8 17h5"/>',
  todo:'<rect x="3" y="3" width="18" height="18" rx="4.5"/><path d="m8 12 3 3 5-6"/>',
  link:'<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>',
  image:'<rect x="3" y="3" width="18" height="18" rx="4.5"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/>',

/* ================= Theme ================= */
const isDark = () => document.documentElement.dataset.theme === 'dark';
const LOOK_KEY = 'tessera-look', sysDark = matchMedia('(prefers-color-scheme: dark)');
let look = (() => { let L = {}; try { L = JSON.parse(localStorage.getItem(LOOK_KEY) || '{}') || {}; } catch {} let m = L.mode; if (!m){ try { m = localStorage.getItem('tessera-theme'); } catch {} } return {mode:['light', 'dark', 'auto'].includes(m) ? m : 'light', shade:L.shade || 'default', accent:L.accent || 'lavender'}; })();
const lookTheme = () => look.mode === 'auto' ? (sysDark.matches ? 'dark' : 'light') : look.mode;
function setLook(patch){ look = {...look, ...patch}; try { localStorage.setItem(LOOK_KEY, JSON.stringify(look)); } catch {} applyTheme(lookTheme()); }
sysDark.addEventListener?.('change', () => { if (look.mode === 'auto') applyTheme(lookTheme()); });
function applyTheme(t){
  const de = document.documentElement; de.dataset.theme = t;
  if (look.shade !== 'default') de.dataset.shade = look.shade; else delete de.dataset.shade;
  if (look.accent !== 'lavender') de.dataset.accent = look.accent; else delete de.dataset.accent;
  try { localStorage.setItem('tessera-theme', t); } catch {}
  const m = $('meta[name="theme-color"]'); if (m) m.content = t === 'dark' ? ({graphite:'#1b1b1e', midnight:'#0a0f1e', oled:'#000000'}[look.shade] || '#08080a') : '#f5f3ee';
  const b = $('#themeBtn'); if (b){ b.innerHTML = ico(t === 'dark' ? 'sun' : 'moon'); b.title = t === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'; }
  if (S) minimapSoon();
}
function toggleTheme(e){
  const next = isDark() ? 'light' : 'dark', r0 = $('#themeBtn').getBoundingClientRect();
  const x = e && e.detail ? e.clientX : r0.left + r0.width / 2, y = e && e.detail ? e.clientY : r0.top + r0.height / 2;
  if (!document.startViewTransition || matchMedia('(prefers-reduced-motion: reduce)').matches){ setLook({mode:next}); return; }
  const rad = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
  const tr = document.startViewTransition(() => setLook({mode:next}));
  tr.ready.then(() => document.documentElement.animate({clipPath:[`circle(0px at ${x}px ${y}px)`, `circle(${rad}px at ${x}px ${y}px)`]},
    {duration:650, easing:'cubic-bezier(.22,1,.36,1)', pseudoElement:'::view-transition-new(root)'})).catch(() => {});
}

/* ================= Storage (IndexedDB) ================= */
let db = null, storageOK = true;
const memImages = new Map(), imgCache = new Map();
function openDB(){
  return new Promise(res => {
    try {
      const rq = indexedDB.open('tessera', 1);
      rq.onupgradeneeded = () => { const d = rq.result; d.createObjectStore('kv'); d.createObjectStore('img'); };
      rq.onsuccess = () => res(rq.result); rq.onerror = () => res(null); rq.onblocked = () => res(null);
    } catch { res(null); }
  });
}
function idb(store, mode, fn){
  return new Promise((res, rej) => {
    const tx = db.transaction(store, mode); const r = fn(tx.objectStore(store));
    tx.oncomplete = () => res(r ? r.result : undefined); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
  });
}
const kvGet = k => idb('kv','readonly', s => s.get(k));
const kvSet = (k, v) => idb('kv','readwrite', s => s.put(v, k));
const kvDel = k => idb('kv','readwrite', s => s.delete(k));
async function imgPut(id, url){ if (!db) { memImages.set(id, url); return; } await idb('img','readwrite', s => s.put(url, id)); }
async function loadImg(id){
  if (!id) return null; if (imgCache.has(id)) return imgCache.get(id);
  let u = null; try { u = db ? await idb('img','readonly', s => s.get(id)) : memImages.get(id); } catch {}
  if (u) imgCache.set(id, u); return u;
}
async function idbClear(store){ if (db) await idb(store,'readwrite', s => s.clear()); }
function usedImageIds(){
  const ids = new Set(), scan = cards => { for (const c of Object.values(cards || {})) for (const k of ['imageId','fileId','thumbId','audioId','imgA','imgB']) if (c[k]) ids.add(c[k]); };
  const scanB = b => { if (!b) return; scan(b.cards); if (b.coverId) ids.add(b.coverId); };
  for (const b of Object.values(S.boards)) scanB(b);
  for (const e of S.trash || []){ scan(e.cards); for (const b of Object.values(e.boards || {})) scanB(b); }
  for (const t of S.templates || []){ scanB(t.board); for (const b of Object.values(t.subs || {})) scanB(b); }
  return ids;
}
async function gcImages(){ if (!db) return; try { const used = usedImageIds();
  for (const k of await idb('kv','readonly', s => s.getAllKeys())) if (String(k).startsWith('ver:')) for (const v of (await kvGet(k)) || []) for (const c of Object.values(v.cards || {})) for (const f of ['imageId','fileId','thumbId','audioId','imgA','imgB']) if (c[f]) used.add(c[f]); const keys = await idb('img','readonly', s => s.getAllKeys()); for (const k of keys) if (!used.has(k)) await idb('img','readwrite', s => s.delete(k)); } catch {} }

/* ---------- delete → trash ---------- */
function collectBoards(bid, into){
  const bd = S.boards[bid]; if (!bd) return;
  into[bid] = bd; delete S.boards[bid];

}
function deleteCards(ids){
  const b = cur(); ids = ids.filter(id => b.cards[id]);
  const lockedN = ids.filter(id => b.cards[id].locked).length; ids = ids.filter(id => !b.cards[id].locked);
  if (!ids.length){ if (lockedN) toast('Locked cards can’t be deleted — unlock them first'); return; }
  commit(); sfx('trash');
  const e = {id:uid(), at:Date.now(), from:b.id, cards:{}, roots:[], boards:{}, links:[]};
  const kill = (id, root) => {
    const c = b.cards[id]; if (!c) return;
    e.cards[id] = c; if (root) e.roots.push(id);
    if (c.type === 'column') [...c.children].forEach(k => kill(k, false));
    if (c.type === 'board') collectBoards(c.target, e.boards);
    if (root && c.parent && b.cards[c.parent]) b.cards[c.parent].children = b.cards[c.parent].children.filter(x => x !== id);
    delete b.cards[id];
  };
  ids.forEach(id => kill(id, true));
  e.links = b.links.filter(l => e.cards[l.from] || e.cards[l.to]);
  b.links = b.links.filter(l => b.cards[l.from] && b.cards[l.to]);
  S.trash.unshift(e);
  sel.clear(); render(); saveSoon();
  const n = e.roots.length;

}

}
function restoreTrash(eid){

  commit(); const e = S.trash.splice(i, 1)[0];
  const t = S.boards[e.from] || S.boards[S.rootId];
  Object.assign(S.boards, e.boards);
  for (const bd of Object.values(e.boards)) if (!S.boards[bd.parent]) bd.parent = t.id;
  Object.assign(t.cards, e.cards);
  let z = maxZ(t);
  for (const id of e.roots){
    const c = t.cards[id]; if (!c) continue;
    if (c.parent){ const p = t.cards[c.parent]; if (p && p.type === 'column'){ if (!p.children.includes(id)) p.children.push(id); } else c.parent = null; }
    if (!c.parent) c.z = ++z;

function moveCards(ids, toId, {noCommit = false} = {}){

  for (const id of ids){ const c = b.cards[id]; if (c.type === 'board' && descendantsOf(c.target).has(toId)){ toast('A board can’t be moved inside itself'); return; } }

function estH(n){
  switch (n.type){
    case 'heading': return {s:40, m:56, l:80}[n.size || 'm']; case 'sticky': return 200; case 'note': return 110;
    case 'todo': return 64 + n.items.length * 30; case 'column': return 56 + Math.max(1, n.kids.length) * 86; case 'table': return 46 + n.rows.length * 33;
    case 'frame': case 'sketch': return n.h; case 'swatch': return n.w * .75 + 60; case 'shot': return n.w * .5625 + 110; case 'font': return 190; case 'compare': return n.w * .75; default: return 120;
  }
}
const specRects = t => t.nodes.map(n => ({x:n.x, y:n.y, w:n.w, h:estH(n), t:n.type, color:n.color, hex:n.hex}));
function previewSVG(rects){
  if (!rects.length) return '<svg viewBox="0 0 160 100"></svg>';
  let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
  for (const r of rects){ x1 = Math.min(x1, r.x); y1 = Math.min(y1, r.y); x2 = Math.max(x2, r.x + r.w); y2 = Math.max(y2, r.y + r.h); }
  const s = Math.min(144 / (x2 - x1 || 1), 84 / (y2 - y1 || 1)), ox = 8 + (144 - (x2 - x1) * s) / 2 - x1 * s, oy = 8 + (84 - (y2 - y1) * s) / 2 - y1 * s, f = v => v.toFixed(1);
  const order = [...rects].sort((a, b) => (b.t === 'frame') - (a.t === 'frame'));
  return `<svg viewBox="0 0 160 100" preserveAspectRatio="xMidYMid meet">${order.map(r => {
    const x = ox + r.x * s, y = oy + r.y * s, w = Math.max(1.5, r.w * s), h = Math.max(1.5, r.h * s);
    if (r.t === 'frame') return `<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" rx="2.5" style="fill:none;stroke:var(--line-3);stroke-width:.7;stroke-dasharray:2 1.5"/>`;
    if (r.t === 'heading') return `<rect x="${f(x)}" y="${f(y + h * .3)}" width="${f(w * .55)}" height="${f(Math.max(2, h * .38))}" rx="1" style="fill:var(--text-2);opacity:.75"/>`;
    const fill = r.t === 'swatch' && r.hex ? r.hex : r.color ? `var(--k-${r.color})` : 'var(--text)';
    return `<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" rx="1.8" style="fill:${fill};opacity:${r.t === 'swatch' ? .95 : r.color ? .38 : .13}"/>`;
  }).join('')}</svg>`;
}
function buildSpec(tpl, b){
  const ids = []; let z = maxZ(b);
  tpl.nodes.forEach(n => {
    const {kids, ...rest} = n, c = {id:uid(), z:n.type === 'frame' ? 0 : ++z, color:null, ...rest};
    if (c.type === 'todo') c.items = c.items.map(i => { const o = {id:uid(), ...i}; if (typeof o.dueIn === 'number'){ const d = new Date(); d.setDate(d.getDate() + o.dueIn); o.due = ymd(d); } delete o.dueIn; return o; });
    if (c.type === 'table') c.rows = c.rows.map(r => [...r]);
    if (c.type === 'column'){ c.children = []; for (const k of kids){ const ch = {id:uid(), z:++z, x:0, y:0, color:null, ...k, parent:c.id}; b.cards[ch.id] = ch; c.children.push(ch.id); } }
    b.cards[c.id] = c; ids.push(c.id);
  });
  (tpl.links || []).forEach(([a, bb, r]) => b.links.push({id:uid(), from:ids[a], to:ids[bb], curve:true, ...(r ? {route:r} : {})}));
}

    target.links.push(...(src.links || []).filter(l => map[l.from] && map[l.to]).map(l => ({...l, id:uid(), from:map[l.from], to:map[l.to]})));

function htmlToMd(html){

    if (t === 'A' && n.getAttribute('href')) return `[${s.trim()}](${n.getAttribute('href')})`;
    if (/^(DIV|P|LI|H\d)$/.test(t)) return '\n' + s + '\n';
    return s;
  };

  const flush = () => { const s = curL.replace(/^\n+|\n+$/g, ''); if (s.trim()) s.split('\n').forEach(l => lines.push(l.trim())); curL = ''; };

      else if (/^H\d$/.test(t)){ flush(); lines.push('### ' + inl(c).trim()); }
      else if (t === 'UL' || t === 'OL'){ flush(); [...c.children].forEach((li, i) => lines.push((t === 'OL' ? `${i + 1}. ` : '- ') + inl(li).trim().replace(/\n+/g, ' '))); }
      else curL += inl(c);
    }
  };
  block(root); flush();
  const plain = l => l && !/^(- |\d+\. |#{1,6} |> )/.test(l);
  return lines.map((l, i) => plain(l) && plain(lines[i + 1]) ? l + '  ' : l).join('\n').replace(/\n{3,}/g, '\n\n').trim();

let actx = null, noiseBuf = null;
const SOUND_LV = {off:0, soft:.22, full:.5};
function sfx(name, preview){
  const lv = SOUND_LV[S?.meta?.sound ?? 'soft'] || (preview ? SOUND_LV.soft : 0); if (!lv) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  } catch { return; }
  const t0 = actx.currentTime + .01, out = actx.createGain(); out.gain.value = lv; out.connect(actx.destination);
  const tone = (f, at, dur, {type = 'sine', g = .5, to = null, attack = .005} = {}) => {
    const o = actx.createOscillator(), v = actx.createGain(); o.type = type;

    v.gain.setValueAtTime(0, t0 + at); v.gain.linearRampToValueAtTime(g, t0 + at + attack); v.gain.exponentialRampToValueAtTime(.0001, t0 + at + dur);
    o.connect(v); v.connect(out); o.start(t0 + at); o.stop(t0 + at + dur + .03);
  };
  const noise = (at, dur, {f = 1200, to = 3000, g = .2, q = .8} = {}) => {
    if (!noiseBuf){ noiseBuf = actx.createBuffer(1, actx.sampleRate * .6, actx.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const s = actx.createBufferSource(), bp = actx.createBiquadFilter(), v = actx.createGain(); s.buffer = noiseBuf;
    bp.type = 'bandpass'; bp.Q.value = q; bp.frequency.setValueAtTime(f, t0 + at); bp.frequency.exponentialRampToValueAtTime(to, t0 + at + dur);
    v.gain.setValueAtTime(0, t0 + at); v.gain.linearRampToValueAtTime(g, t0 + at + dur * .35); v.gain.exponentialRampToValueAtTime(.0001, t0 + at + dur);
    s.connect(bp); bp.connect(v); v.connect(out); s.start(t0 + at); s.stop(t0 + at + dur + .03);
  };
  switch (name){
    case 'pop': tone(540, 0, .1, {g:.42, to:860}); tone(1080, .025, .08, {g:.1}); break;
    case 'trash': tone(320, 0, .18, {g:.36, to:140, type:'triangle'}); noise(0, .14, {f:1400, to:300, g:.1}); break;
    case 'check': tone(880, 0, .09, {g:.28}); tone(1318.5, .07, .2, {g:.26}); break;
    case 'uncheck': tone(700, 0, .09, {g:.2, to:520}); break;
    case 'tick': tone(1900, 0, .035, {g:.12, type:'triangle'}); break;
    case 'drop': tone(400, 0, .11, {g:.32, to:250}); tone(800, .015, .06, {g:.07}); break;
    case 'whoosh': noise(0, .34, {f:450, to:2600, g:.16, q:.7}); break;
    case 'back': noise(0, .3, {f:2600, to:450, g:.13, q:.7}); break;
    case 'link': tone(660, 0, .08, {g:.22}); tone(990, .055, .14, {g:.2}); break;
    case 'success': [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, i * .065, .32, {g:.17})); break;
    case 'undo': tone(760, 0, .08, {g:.16, to:540, type:'triangle'}); break;
    case 'slide': noise(0, .2, {f:1600, to:3800, g:.07}); tone(1250, 0, .05, {g:.06}); break;
  }
}

/* ================= Phase 7: version history ================= */
const VER_EVERY = 10 * 60e3, VER_AUTO = 40;
const verKey = bid => 'ver:' + bid, verDirty = new Set(), verLast = new Map();
async function verList(bid){ if (!db) return []; try { return (await kvGet(verKey(bid))) || []; } catch { return []; } }
const boardSnap = b => JSON.parse(JSON.stringify({title:b.title, icon:b.icon || null, bg:b.bg || null, kanban:!!b.kanban, cards:b.cards, links:b.links || []}));
function snapHash(s){ const str = JSON.stringify([s.title, s.bg, s.kanban, s.cards, s.links]); let h = 0; for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0; return h + ':' + str.length; }

function saveVersion(bid, name = null){
  verChain = verChain.then(async () => {
    const b = S.boards[bid]; if (!db || !b) return null;
    const snap = boardSnap(b), hash = snapHash(snap), list = await verList(bid);
    verLast.set(bid, Date.now()); verDirty.delete(bid);

    const v = {id:uid(), at:Date.now(), name, hash, ...snap};

}
function markVerDirty(){ if (S && curId) verDirty.add(curId); }

function estCardH(c){

const isTop = ov => [...document.querySelectorAll('.overlay')].pop() === ov;
function modal({title, html, actions, onOpen, dismissable = true, eyebrow = '', cls = ''}){
  return new Promise(res => {
    const ov = document.createElement('div'); ov.className = 'overlay';
    ov.innerHTML = `<div class="modal glass ${cls}" role="dialog" aria-modal="true">${eyebrow ? `<div class="eyebrow">${eyebrow}</div>` : ''}<h2>${title}</h2><div class="m-body">${html}</div><div class="m-actions">${actions.map((a, i) => `<button class="btn ${a.kind || ''}" data-i="${i}">${a.label}</button>`).join('')}</div></div>`;
    document.body.appendChild(ov); requestAnimationFrame(() => ov.classList.add('show'));
    let done = false;
    const close = v => { if (done) return; done = true; ov.classList.remove('show'); setTimeout(() => ov.remove(), 220); document.removeEventListener('keydown', kd, true); ov._onClose?.(); res(v); };
    ov._close = close;

      const b = e.target.closest('[data-i]'); if (!b) return;
      const a = actions[+b.dataset.i]; const r = a.fn ? a.fn(ov) : a.value; if (r === false) return; close(r === undefined ? (a.value ?? null) : r);
    });
    ov.addEventListener('click', e => { if (e.target === ov && dismissable) close(null); });
    const kd = e => {
      if (!isTop(ov)) return;
      if (e.key === 'Escape' && dismissable){ e.preventDefault(); e.stopPropagation(); close(null); }
      else if (e.key === 'Enter' && !e.target.closest?.('button')){ const i = actions.findIndex(a => a.primary); if (i > -1){ e.preventDefault(); ov.querySelector(`.m-actions [data-i="${i}"]`).click(); } }
    };

  });
}
function toast(msg, action, ms = 4200){

  t.innerHTML = `<span>${esc(msg)}</span>${action ? `<button>${esc(action.label)}</button>` : ''}`;

function cardInfo(c){
  if (c.type === 'note'){ const t = htmlText(c.html); return {title:t.slice(0, 90) || 'Empty note', text:t}; }
  if (c.type === 'todo'){ const items = (c.items || []).map(i => i.text).filter(Boolean); return {title:c.title || items[0] || 'To-do list', text:[c.title, ...items].filter(Boolean).join(' · ')}; }
  if (c.type === 'link'){ const t = c.title || hostOf(c.url); return {title:t, text:`${t} ${c.url}`}; }
  if (c.type === 'column') return {title:c.title || 'Column', text:c.title || ''};
  if (c.type === 'frame') return {title:c.title || 'Frame', text:c.title || ''};
  if (c.type === 'sticky' || c.type === 'heading'){ const t = htmlText(c.html); return {title:t.slice(0, 90) || (c.type === 'sticky' ? 'Sticky note' : 'Heading'), text:t}; }
  if (c.type === 'table'){ const t = (c.rows || []).flat().filter(Boolean).join(' · '); return {title:c.title || (c.rows?.[0] || []).filter(Boolean).join(' · ') || 'Table', text:[c.title, t].filter(Boolean).join(' · ')}; }
  if (c.type === 'swatch') return {title:c.name || (c.hex || '').toUpperCase(), text:`${c.name || ''} ${c.hex || ''}`};
  if (c.type === 'video') return {title:c.title || (c.provider === 'vimeo' ? 'Vimeo video' : 'YouTube video'), text:`${c.title || ''} ${c.url || ''}`};
  if (c.type === 'file') return {title:c.name || 'File', text:c.name || ''};
  if (c.type === 'audio') return {title:c.title || 'Voice memo', text:c.title || ''};
  if (c.type === 'sketch') return {title:'Sketch', text:''};
  if (c.type === 'shot'){ const t = `Shot ${pad2(c.num)}${c.title ? ' · ' + c.title : ''}`; return {title:t, text:[t, c.size, c.move, c.notes].filter(Boolean).join(' · ')}; }
  if (c.type === 'font') return {title:cleanFam(c.family) || 'Font', text:`${c.family || ''} ${c.sample || ''}`};
  if (c.type === 'compare') return {title:`${c.la || 'Before'} / ${c.lb || 'After'}`, text:`${c.la || ''} ${c.lb || ''}`};
  if (c.type === 'image') return {title:c.caption || 'Image', text:c.caption || ''};
  if (c.type === 'board') return {title:S.boards[c.target]?.title || 'Board', text:''};
  return {title:'Card', text:''};
}
function matchScore(text, terms){

  return s;
}
function hl(raw, terms){
  raw = String(raw || ''); if (!terms.length) return esc(raw);
  const low = raw.toLowerCase(), m = new Array(raw.length).fill(false);
  for (const q of terms){ let i = low.indexOf(q); while (i > -1){ for (let k = i; k < i + q.length; k++) m[k] = true; i = low.indexOf(q, i + q.length); } }
  let out = '', on = false;
  for (let i = 0; i < raw.length; i++){ if (m[i] && !on){ out += '<mark>'; on = true; } if (!m[i] && on){ out += '</mark>'; on = false; } out += esc(raw[i]); }

}
function snippet(text, terms, n = 80){

}

function openPalette(mode = 'search', opts = {}){
  if (document.querySelector('.overlay.pal')) return;
  blurEditing(); hideMenus();
  const move = mode === 'move';
  const ov = document.createElement('div'); ov.className = 'overlay pal';
  ov.innerHTML = `<div class="palette glass" role="dialog" aria-label="${move ? 'Move to board' : 'Search'}"><div class="pal-in">${ico(move ? 'move' : 'search', 18)}<input placeholder="${move ? 'Move to which board?' : 'Search boards and cards, or type a command…'}" spellcheck="false" autocomplete="off"><kbd>Esc</kbd></div><div class="pal-list"></div><div class="pal-foot"><span><kbd>↑</kbd> <kbd>↓</kbd> to navigate</span><span><kbd>Enter</kbd> to ${move ? 'move' : 'open'}</span></div></div>`;
  document.body.appendChild(ov); requestAnimationFrame(() => ov.classList.add('show'));
  const inp = ov.querySelector('input'), list = ov.querySelector('.pal-list');
  let exclude = new Set([curId]);
  if (move) for (const id of opts.ids || []){ const c = cur().cards[id]; if (c?.type === 'board') descendantsOf(c.target, exclude); }
  const boards = Object.values(S.boards).filter(b => !(move && exclude.has(b.id)));
  const cards = [];
  if (!move) for (const b of Object.values(S.boards)) for (const c of Object.values(b.cards)){ if (c.type === 'board' || lockedAncestor(b.id)) continue; const info = cardInfo(c), tg = (c.tags || []).map(t => '#' + t).join(' '), text = [info.text, tg].filter(Boolean).join(' · '); if (text) cards.push({b, c, ...info, text}); }
  const actions = move ? [] : paletteActions();
  const arch = archivedIds(), boardRow = (b, terms) => ({icon:b.id === S.rootId ? 'home' : b.lock ? 'lock' : isPinned(b.id) ? 'starFill' : 'board', emoji:b.id === S.rootId ? '' : b.icon, t:hl(b.title, terms), s:esc((arch.has(b.id) ? 'Archived · ' : '') + (boardPath(b) || 'Top level')), kbd:b.id === curId ? 'Current' : '',

  let rows = [], active = 0;

      else {
