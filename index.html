  if (!backupDir) return `<h4>${ico('folder', 16)}Auto-backup to a folder<span class="badge">Off</span></h4><p>Tessera writes a backup file to a folder you choose about once a minute while you work, and keeps a dated copy for each of the last 14 days. Choose a folder inside Google Drive, OneDrive or Dropbox to keep a copy off this device too.</p><div class="row"><button class="btn sm primary" data-ab="choose">${ico('folder', 14)}Choose folder…</button></div>`;
  if (backupPerm !== 'granted') return `<h4>${ico('folder', 16)}Auto-backup to a folder<span class="badge warn">Paused</span></h4><p>The browser needs your permission again to save into “${esc(backupDir.name)}”. This usually happens after restarting it.</p><div class="row"><button class="btn sm primary" data-ab="reconnect">Reconnect</button><button class="btn sm" data-ab="choose">Change folder</button><button class="btn sm" data-ab="off">Turn off</button></div>`;
  return `<h4>${ico('folder', 16)}Auto-backup to a folder<span class="badge ok">On</span></h4><p>Saving to “${esc(backupDir.name)}”. Last auto-backup: ${S.meta.lastAutoBackup ? relTime(S.meta.lastAutoBackup) : 'not yet'}.</p><div class="row"><button class="btn sm" data-ab="now">Back up now</button><button class="btn sm" data-ab="choose">Change folder</button><button class="btn sm" data-ab="off">Turn off</button></div>`;
}
function storagePanel(){
  const nb = Object.keys(S.boards).length, nc = Object.values(S.boards).reduce((n, b) => n + Object.keys(b.cards).length, 0);
  const last = lastBackupAt();
  const html = `${!storageOK ? `<div class="warnbox">This browser isn’t letting Tessera save (private window or blocked storage). Anything you make will be lost when you close the page — export a backup before leaving.</div>` : ''}
<p>Everything you make lives privately in this browser on this device. Nothing is uploaded or synced.</p>
<div class="meter"><i id="st-bar"></i></div><div class="meter-l"><span id="st-used">Measuring…</span><span id="st-free"></span></div>
<div class="stat"><span>Boards &amp; cards</span><b>${nb} board${nb > 1 ? 's' : ''} · ${nc} card${nc === 1 ? '' : 's'}</b></div>
<div class="stat"><span>Media &amp; files</span><span class="r"><b id="st-img">…</b><button class="btn sm" id="st-compress" ${WEBP_OK ? '' : 'disabled title="Not supported in this browser"'}>Compress</button></span></div>
<div class="stat"><span>Trash</span><span class="r"><b>${S.trash.length ? `${S.trash.length} item${S.trash.length > 1 ? 's' : ''}` : 'Empty'}</b><button class="btn sm" id="st-trash">Open</button></span></div>
<div class="stat"><span>Last backup</span><b>${last ? relTime(last) : 'Never'}</b></div>
<div class="sec" id="st-ab">${abSection()}</div>
<details class="more"><summary>What “on this device” means</summary><ul class="facts">
<li>${ico('device', 18)}<div><b>Not synced</b>Boards don’t follow you to other devices, browsers or browser profiles.</div></li>
<li>${ico('trash', 18)}<div><b>Can be erased</b>Clearing browsing data for this site, uninstalling the app or using a private window removes your boards.</div></li>
<li>${ico('download', 18)}<div><b>Back up regularly</b>Turn on auto-backup, or export a backup file (Ctrl S). Import it on any device to restore.</div></li></ul></details>`;
  modal({title:'Storage & backup', eyebrow:'On this device', cls:'wide', html,
    actions:[{label:'Import…', kind:'left', fn:() => { importBackup(); }}, {label:'Close', value:null}, {label:'Export backup', kind:'primary', primary:true, fn:() => { exportBackup(); }}],
    onOpen: async ov => {
      const $o = s => ov.querySelector(s);
      const sec = $o('#st-ab');
      sec.addEventListener('click', async e => {
        const b = e.target.closest('[data-ab]'); if (!b) return; b.disabled = true;
        const a = b.dataset.ab;
        if (a === 'choose') await chooseBackupFolder();
        else if (a === 'reconnect') await reconnectBackup();
        else if (a === 'off') await turnOffAutoBackup();
        else if (a === 'now'){ if (await runAutoBackup(true)) toast('Backed up to your folder'); }
        sec.innerHTML = abSection();
      });
      $o('#st-trash').onclick = () => { ov._close(null); openTrash(); };
      const showImgs = async () => { const st = await imageStats(); $o('#st-img').textContent = st.n ? `${st.n} · ${fmtBytes(st.bytes)}` : 'None'; $o('#st-compress').disabled = !WEBP_OK || !st.n; };
      $o('#st-compress').onclick = async e => {
        const btn = e.currentTarget;
        const ok = await modal({title:'Compress images?', html:'<p>Large images are resized to 1400px and saved in a lighter format. They’ll look the same on your boards but use much less space.</p><p>This can’t be undone.</p>', actions:[{label:'Cancel', value:false}, {label:'Compress', kind:'primary', primary:true, value:true}]});
        if (!ok) return;
        btn.disabled = true;
        const saved = await compressImages((i, n) => { btn.textContent = `${i} / ${n}`; });
        btn.textContent = 'Compress'; render(); await showImgs(); measure();
        toast(saved > 1024 ? `Saved ${fmtBytes(saved)}` : 'Images are already compact');
      };
      const measure = async () => {
        try {
          const est = await navigator.storage?.estimate?.(), persisted = await navigator.storage?.persisted?.();
          if (est && est.quota){
            const pct = clamp(est.usage / est.quota * 100, 1.5, 100);
            requestAnimationFrame(() => $o('#st-bar').style.width = pct + '%');
            $o('#st-used').textContent = `${fmtBytes(est.usage)} used${persisted ? ' · protected from auto-cleanup' : ''}`;
            $o('#st-free').textContent = `${fmtBytes(Math.max(0, est.quota - est.usage))} available`;
          } else $o('#st-used').textContent = 'Usage unavailable in this browser';
        } catch { $o('#st-used').textContent = 'Usage unavailable in this browser'; }
      };
      measure(); showImgs();
      setTimeout(() => $o('.btn.primary')?.focus({preventScroll:true}), 60);
    }});
}

function welcome(){
  return modal({title:'Your boards stay on this device', eyebrow:'Before you begin', dismissable:false,
    html:`<p>Tessera has no accounts and no cloud. Everything you create is kept privately in this browser, on this device only.</p>
<ul class="facts">
<li>${ico('device',18)}<div><b>Not synced</b>Boards don’t follow you to other devices, browsers or browser profiles.</div></li>
<li>${ico('trash',18)}<div><b>Can be erased</b>Clearing browsing data for this site, uninstalling the app or using a private window will remove your boards.</div></li>
<li>${ico('folder',18)}<div><b>Back up regularly</b>Turn on auto-backup to a folder, or export a backup file from the storage chip in the corner.</div></li>
</ul>`,
    actions:[{label:'I understand', kind:'primary', primary:true, value:true}]}).then(async () => {
      S.meta.welcomed = true; saveSoon(false); try { await navigator.storage?.persist?.(); } catch {}
    });
}
function shortcuts(){
  const rows = [['Search & commands','<kbd>Ctrl</kbd> <kbd>K</kbd> · <kbd>/</kbd>'],['New note / to-do / link','<kbd>N</kbd> <kbd>T</kbd> <kbd>L</kbd>'],['New image / board / column','<kbd>I</kbd> <kbd>B</kbd> <kbd>C</kbd>'],['New frame','<kbd>F</kbd>'],['Board from a template','<kbd>M</kbd>'],['Image gallery','Double-click an image · <kbd>←</kbd> <kbd>→</kbd>'],['Sticky / heading / sketch','<kbd>S</kbd> <kbd>H</kbd> <kbd>D</kbd>'],['Table / colour / video','<kbd>G</kbd> <kbd>K</kbd> <kbd>V</kbd>'],['File / audio','<kbd>U</kbd> <kbd>A</kbd>'],['While sketching','<kbd>P</kbd> pen · <kbd>H</kbd> highlight · <kbd>E</kbd> erase'],['Quick note','Double-click canvas'],['Move into a board','Drag onto its tile'],['Frame selection','<kbd>Ctrl</kbd> <kbd>G</kbd>'],['Lock / unlock','<kbd>Ctrl</kbd> <kbd>⇧</kbd> <kbd>L</kbd>'],['Drag without snapping','Hold <kbd>Alt</kbd>'],['Label an arrow','Double-click it'],['Pan','Scroll · <kbd>Space</kbd> + drag'],['Zoom','<kbd>Ctrl</kbd> + scroll · pinch'],['Fit to screen','<kbd>Ctrl</kbd> <kbd>0</kbd>'],['Undo / redo','<kbd>Ctrl</kbd> <kbd>Z</kbd> · <kbd>Ctrl</kbd> <kbd>⇧</kbd> <kbd>Z</kbd>'],['Duplicate','<kbd>Ctrl</kbd> <kbd>D</kbd>'],['Copy / paste cards','<kbd>Ctrl</kbd> <kbd>C</kbd> · <kbd>Ctrl</kbd> <kbd>V</kbd>'],['Edit note / open board','<kbd>Enter</kbd>'],['Move to Trash','<kbd>Del</kbd>'],['Back to parent board','<kbd>Esc</kbd>'],['Export backup','<kbd>Ctrl</kbd> <kbd>S</kbd>'],['Export & share','<kbd>Ctrl</kbd> <kbd>E</kbd>'],['Print','<kbd>Ctrl</kbd> <kbd>P</kbd>'],['Present','<kbd>P</kbd> · <kbd>←</kbd> <kbd>→</kbd> · <kbd>Esc</kbd>'],['Focus mode','<kbd>⇧</kbd> <kbd>F</kbd>'],['Move card between columns','<kbd>Alt</kbd> + <kbd>←</kbd> <kbd>→</kbd> <kbd>↑</kbd> <kbd>↓</kbd>']];
  modal({title:'Keyboard shortcuts', html:`<div class="kbd-grid">${rows.map(r => `<span>${r[0]}</span><span>${r[1]}</span>`).join('')}</div>`, actions:[{label:'Done', kind:'primary', primary:true}]});
}
async function exportBackup(){
  try {
    S.meta.lastExport = Date.now();
    const data = await buildBackup();
    const url = URL.createObjectURL(new Blob([JSON.stringify(data)], {type:'application/json'}));
    const a = document.createElement('a'); a.href = url; a.download = `tessera-backup-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000);
    saveSoon(false); toast('Backup exported');
  } catch { toast('Export failed — please try again'); }
}
function importBackup(){
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return; let data;
    try { data = JSON.parse(await f.text()); } catch { toast('That file isn’t a valid backup'); return; }
    if (data?.app === 'tessera' && data.kind === 'board'){ importBoardData(data); return; }
    if (data?.app !== 'tessera' || !data.state?.boards?.[data.state.rootId]){ toast('That file isn’t a Tessera backup'); return; }
    const n = Object.keys(data.state.boards).length;
    const ok = await modal({title:'Replace your boards?', html:`<p>This replaces everything on this device with the backup from <b>${esc(new Date(data.exportedAt).toLocaleString())}</b> (${n} board${n > 1 ? 's' : ''}).</p><p>Export a backup first if you want to keep what’s here now.</p>`,
      actions:[{label:'Cancel', value:false}, {label:'Replace', kind:'danger', primary:true, value:true}]});
    if (!ok) return;
    try {
      await idbClear('img'); memImages.clear(); imgCache.clear();
      for (const [id, u] of Object.entries(data.images || {})) await imgPut(id, u);
    } catch { toast('Not enough storage to restore every image'); }
    S = data.state; normalizeState(); S.meta.welcomed = true;
    curId = S.rootId; hist.past = []; hist.future = []; sel.clear(); selLink = null;
    const needFit = !cur().view.set; render(); if (needFit) fit(false); await saveNow(); toast('Backup restored');
  };
  inp.click();
}
async function eraseAll(){
  const ok = await modal({title:'Erase everything?', html:'<p>Every board, card, image and trashed item on this device will be permanently deleted. This can’t be undone.</p><p>Export a backup first if you might want them back.</p>',
    actions:[{label:'Cancel', value:false}, {label:'Erase everything', kind:'danger', value:true}]});
  if (!ok) return;
  try { const keepDir = backupDir; await idbClear('img'); await idbClear('kv'); if (keepDir) await kvSet('backupDir', keepDir); } catch {}
  memImages.clear(); imgCache.clear(); seed(); S.meta.welcomed = true; curId = S.rootId;
  hist.past = []; hist.future = []; sel.clear(); render(); fit(false); saveNow(); toast('Everything erased');
}
let deferredInstall = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; });
function openMoreMenu(){
  const r = $('#moreBtn').getBoundingClientRect(), tn = S.trash.length;
  const dr = updateDueBadge() || {over:0, today:0, soon:0}, dn = dr.over + dr.today + dr.soon;
  const items = [{label:'Search & commands', icon:'search', kbd:'Ctrl K', fn:() => openPalette()},
    {label:'Due soon', icon:'calendar', badge:dn ? String(dn) : '', badgeOver:dr.over > 0, fn:openDueSoon},
    {label:'Present', icon:'present', kbd:'P', fn:startPresentation},
    {label:focusMode ? 'Leave focus mode' : 'Focus mode', icon:'focus', kbd:'⇧ F', fn:() => toggleFocus()}, {sep:true},
    {label:'Export & share…', icon:'share', kbd:'Ctrl E', fn:() => openExport()}, {label:'Import a board…', icon:'upload', fn:() => importBoardFile()}, {sep:true},
    {label:'Export backup', icon:'download', kbd:'Ctrl S', fn:exportBackup}, {label:'Import backup…', icon:'upload', fn:importBackup},
    {label:'Storage & backup', icon:'database', fn:() => storagePanel()}, {label:'Trash', icon:'trash', kbd:tn ? String(tn) : '', fn:openTrash}, {sep:true},
    {label:isDark() ? 'Light mode' : 'Dark mode', icon:isDark() ? 'sun' : 'moon', fn:() => toggleTheme()},
    {label:'View options…', icon:'sliders', fn:() => openViewMenu(r.right, r.bottom + 8, true)},
    {label:'Templates…', icon:'template', kbd:'M', fn:() => openTemplates('new')}, {label:'Save board as template…', icon:'template', fn:() => saveAsTemplate()},
    {label:'Keyboard shortcuts', icon:'keyboard', fn:shortcuts}];
  if (deferredInstall) items.push({label:'Install app', icon:'install', fn:async () => { deferredInstall.prompt(); try { await deferredInstall.userChoice; } catch {} deferredInstall = null; }});
  items.push({sep:true}, {label:'Erase everything…', icon:'trash', danger:true, fn:eraseAll});
  openMenu(items, r.right, r.bottom + 8, true);
}

/* ================= Chrome wiring ================= */
document.querySelectorAll('[data-ico]').forEach(n => n.innerHTML = ico(n.dataset.ico, +n.dataset.s || 18));
applyTheme(isDark() ? 'dark' : 'light');
const tap = (id, fn) => $(id).addEventListener('click', e => { e.currentTarget.blur(); fn(e); });
tap('#undoBtn', undo); tap('#redoBtn', redo);
tap('#zoomIn', () => zoomBy(1.25)); tap('#zoomOut', () => zoomBy(1 / 1.25));
tap('#zl', () => zoomTo(1)); tap('#fitBtn', () => fit());
tap('#moreBtn', () => ctx.classList.contains('show') ? hideMenus() : openMoreMenu());
tap('#brand', () => ctx.classList.contains('show') ? hideMenus() : openBoardsMenu());
tap('#chip', () => storagePanel());
tap('#searchBtn', () => openPalette());
tap('#themeBtn', e => toggleTheme(e));
tap('#pinBtn', () => togglePin(curId));
tap('#dueBtn', openDueSoon); tap('#presBtn', startPresentation);
tap('#emTpl', () => openTemplates('here'));
$('#crumbs').addEventListener('click', e => {
  const c = e.target.closest('.crumb'); if (!c) return;
  if (c.dataset.b === curId){ const sp = c.querySelector('span'); if (!sp.isContentEditable) inlineEdit(sp, cur().title, v => { cur().title = v; }); }
  else openBoard(c.dataset.b);
});
window.addEventListener('resize', () => { if (fmtFor) positionFormatBar(); hideMenus(); minimapSoon(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden'){ saveNow(); if (abDirty) runAutoBackup(); } });
window.addEventListener('pagehide', saveNow);

/* ================= Boot ================= */
function normalizeState(){
  S.meta = S.meta || {}; S.meta.pinned = S.meta.pinned || []; S.meta.recent = S.meta.recent || []; S.templates = S.templates || [];
  S.trash = (S.trash || []).filter(e => Date.now() - e.at < TRASH_DAYS * DAY);
  for (const b of Object.values(S.boards)){ b.view = b.view || {x:0,y:0,s:1,set:false}; b.links = b.links || []; }
}
async function init(){
  db = await openDB(); storageOK = !!db;
  let st = null; try { st = db ? await kvGet('state') : null; } catch {}
  if (st && st.boards && st.boards[st.rootId]) S = st; else seed();
  normalizeState();
  curId = S.boards[S.meta.lastBoard] ? S.meta.lastBoard : S.rootId; touchRecent(curId);
  const needFit = !cur().view.set;
  render(); if (needFit) fit(false);
  stage.classList.add('in'); updateStorageChip(); updateDueBadge();
  document.fonts?.ready?.then(() => { world.querySelectorAll('.ti-text').forEach(autosize); drawLinks(); if (needFit) fit(false); });
  if (!storageOK) toast('Storage is blocked here — changes won’t be saved', {label:'Details', fn:() => storagePanel()}, 9000);
  await initAutoBackup();
  if (S.meta.welcomed) setTimeout(dueReminder, 2400);
  if (!S.meta.welcomed) setTimeout(welcome, 500);
  else if (!backupDir){
    const total = Object.values(S.boards).reduce((n, b) => n + Object.keys(b.cards).length, 0);
    if (total > 8 && Date.now() - lastBackupAt() > 7 * DAY) setTimeout(() => toast('It’s been a while since your last backup', {label:'Back up', fn:() => storagePanel()}, 8000), 1400);
  }
  gcImages();
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && window.isSecureContext){
    try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch {}
  }
}
init();
})();
</script>
