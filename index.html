        groups.push({label:'Recent', items:recentBoards().map(b => boardRow(b, []))});
        groups.push({label:'Actions', items:actions.map(a => ({icon:a.icon, t:esc(a.label), kbd:a.kbd, run:a.run}))});
      }
    } else {
      const bs = boards.map(b => ({b, s:matchScore(b.title, terms)})).filter(x => x.s >= 0).sort((a, b) => b.s - a.s).slice(0, 8);
      groups.push({label:'Boards', items:bs.map(x => boardRow(x.b, terms))});
      if (!move){
        const cs = cards.map(x => ({...x, s:matchScore(x.text, terms)})).filter(x => x.s >= 0).sort((a, b) => b.s - a.s).slice(0, 30);
        groups.push({label:'Cards', items:cs.map(x => {
          const inTitle = terms.every(q => x.title.toLowerCase().includes(q));
          const where = `in ${esc(boardPath(x.b, true))}`;
          return {icon:x.c.type, t:hl(x.title, terms), s:inTitle ? where : `${hl(snippet(x.text, terms), terms)} · ${where}`, run:() => goToCard(x.b.id, x.c.id)};
        })});
        groups.push({label:'Actions', items:actions.filter(a => matchScore(a.label, terms) >= 0).slice(0, 6).map(a => ({icon:a.icon, t:hl(a.label, terms), kbd:a.kbd, run:a.run}))});
      }
    }
    rows = []; let h = '';
    for (const g of groups){
      if (!g.items.length) continue;
      h += `<div class="pal-label">${g.label}</div>`;
      for (const it of g.items){ const i = rows.length; rows.push(it); h += `<div class="pal-row" data-i="${i}"><span class="pal-ic">${it.emoji ? `<span class="pal-emo">${esc(it.emoji)}</span>` : ico(it.icon, 16)}</span><span class="pal-txt"><div class="pal-t">${it.t}</div>${it.s ? `<div class="pal-s">${it.s}</div>` : ''}</span>${it.kbd ? `<span class="k">${it.kbd}</span>` : ''}</div>`; }
    }
    if (!rows.length) h = `<div class="pal-empty">${move ? 'There’s no other board to move to yet.<br>Add a board card first.' : `Nothing matches “${esc(inp.value.trim())}”`}</div>`;

  };

  const close = () => { ov.classList.remove('show'); setTimeout(() => ov.remove(), 200); };
  const pick = i => { const it = rows[i]; if (!it) return; close(); setTimeout(() => it.run(), 10); };

  inp.addEventListener('keydown', e => {

  ov.addEventListener('pointerdown', e => { if (e.target === ov) close(); });

}

async function emptyTrash(ov){

async function writeFile(dir, name, data){ const fh = await dir.getFileHandle(name, {create:true}); const w = await fh.createWritable(); await w.write(data); await w.close(); }

    { const d = new Date(), y0 = new Date(d.getFullYear(), 0, 1), wk = `${d.getFullYear()}-W${String(Math.ceil(((d - y0) / DAY + y0.getDay() + 1) / 7)).padStart(2, '0')}`; await writeFile(backupDir, `tessera-weekly-${wk}.json`, json);

const WEBP_OK = (() => { try { const c = document.createElement('canvas'); c.width = c.height = 1; return c.toDataURL('image/webp').startsWith('data:image/webp'); } catch { return false; } })();
async function imageStats(){ let n = 0, bytes = 0; for (const id of usedImageIds()){ const u = await loadImg(id); if (u){ n++; bytes += u.length * .75; } } return {n, bytes}; }
async function compressImages(onProgress){
  const ids = [...usedImageIds()]; let saved = 0;
  for (let i = 0; i < ids.length; i++){
    onProgress?.(i + 1, ids.length);
    const u = await loadImg(ids[i]); if (!u || !/^data:image\//.test(u) || /^data:image\/(gif|svg)/.test(u)) continue;
    try {
      const im = new Image(); im.src = u; await im.decode();
      const k = Math.min(1, 1400 / Math.max(im.naturalWidth, im.naturalHeight));
      const cv = document.createElement('canvas'); cv.width = Math.max(1, Math.round(im.naturalWidth * k)); cv.height = Math.max(1, Math.round(im.naturalHeight * k));
      const cx = cv.getContext('2d'); cx.imageSmoothingQuality = 'high'; cx.drawImage(im, 0, 0, cv.width, cv.height);
      const out = cv.toDataURL('image/webp', .78);
      if (out.startsWith('data:image/webp') && out.length < u.length * .9){ await imgPut(ids[i], out); imgCache.set(ids[i], out); saved += u.length - out.length; }
    } catch {}

/* ================= Boot ================= */
function normalizeState(){
  S.meta = S.meta || {}; S.archive = S.archive || []; S.meta.pinned = S.meta.pinned || []; S.meta.recent = S.meta.recent || []; S.templates = S.templates || [];
  S.trash = (S.trash || []).filter(e => Date.now() - e.at < TRASH_DAYS * DAY);
  for (const b of Object.values(S.boards)){ b.view = b.view || {x:0,y:0,s:1,set:false}; b.links = b.links || []; }
}
async function init(){
  db = await openDB(); storageOK = !!db;
  let st = null; try { st = db ? await kvGet('state') : null; } catch {}
  if (st && st.boards && st.boards[st.rootId]) S = st; else seed();
  normalizeState(); renderDock();
  curId = S.boards[S.meta.lastBoard] ? S.meta.lastBoard : S.rootId; if (lockedAncestor(curId)) curId = S.rootId; touchRecent(curId);
  const needFit = !cur().view.set;
  render(); if (needFit) fit(false);
  stage.classList.add('in'); updateStorageChip(); updateDueBadge(); verEnsure(curId);
  document.fonts?.ready?.then(() => { world.querySelectorAll('.ti-text').forEach(autosize); drawLinks(); if (needFit) fit(false); });
  if (!storageOK) toast('Storage is blocked here — changes won’t be saved', {label:'Details', fn:() => storagePanel()}, 9000);
  await initAutoBackup();
  const showStart = S.meta.welcomed && !S.meta.splashOff && Date.now() - lastActiveAtLoad > AWAY;
  if (!S.meta.welcomed) setTimeout(showWelcome, 200);
  else if (showStart) showSplash();
  else { setTimeout(dueReminder, 2400); backupNudge(); setTimeout(() => loadThumb(curId).then(u => { if (!u) captureThumb(curId); }), 3000); }
  touchActive();
  setTimeout(() => syncCheck(true), 1500);
  gcImages();
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && window.isSecureContext){
    try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch {}
  }
}
init();
})();
